name: Temporary STREME DNA1 Seed0 Rerun

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-streme-dna1-seed0-rerun.yml'

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Install STREME 5.5.9
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: streme-benchmark
          create-args: >-
            -c conda-forge
            -c bioconda
            meme=5.5.9
          cache-environment: true
          init-shell: bash

      - name: Download exact synthetic DNA dataset
        uses: actions/download-artifact@v4
        with:
          name: prosampler-benchmark-package
          path: benchmark/package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SeMinLim/morbius_plus
          run-id: 31936768291

      - name: Run single-core STREME measurements
        shell: micromamba-shell {0}
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -euo pipefail

          mkdir -p benchmark/result benchmark/output

          INPUT_FILE='benchmark/package/DATASET_DNA_1.fa'
          STREME_BIN="$(command -v streme)"
          CPU_ALLOWED="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          CPU_ID="$(printf '%s' "$CPU_ALLOWED" | cut -d',' -f1 | cut -d'-' -f1)"
          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"
          STREME_VERSION="$($STREME_BIN --version 2>&1 | head -n 1)"

          sha256sum "$INPUT_FILE" > benchmark/result/input_checksum.sha256
          printf 'motif_length\tstatus\telapsed_seconds\tuser_seconds\tsystem_seconds\tmax_rss_kb\texit_code\tcpu_model\tstreme_version\n' \
            > benchmark/result/streme_dna1_seed0.tsv

          {
            echo "CPU model       : $CPU_MODEL"
            echo "CPU allowed     : $CPU_ALLOWED"
            echo "Pinned CPU      : $CPU_ID"
            echo "STREME version  : $STREME_VERSION"
            echo "Input           : DATASET_DNA_1.fa"
            echo "Input SHA-256   : $(sha256sum "$INPUT_FILE" | awk '{print $1}')"
            echo "Parameters      : --dna --w W --nmotifs 1 --order 2 --seed 0"
            echo "Strand mode     : standard DNA search including reverse complements"
          } > benchmark/result/environment.txt

          for MOTIF_LENGTH in 4 8 16; do
            OUTPUT_DIR="benchmark/output/W${MOTIF_LENGTH}"
            TIME_FILE="benchmark/result/time_W${MOTIF_LENGTH}.tsv"
            LOG_FILE="benchmark/result/run_W${MOTIF_LENGTH}.log"

            rm -rf "$OUTPUT_DIR"
            sync
            sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true

            set +e
            /usr/bin/time \
              -f '%e\t%U\t%S\t%M\t%x' \
              -o "$TIME_FILE" \
              taskset -c "$CPU_ID" \
              "$STREME_BIN" \
                --p "$INPUT_FILE" \
                --dna \
                --w "$MOTIF_LENGTH" \
                --nmotifs 1 \
                --order 2 \
                --seed 0 \
                --oc "$OUTPUT_DIR" \
              > "$LOG_FILE" 2>&1
            COMMAND_RC=$?
            set -e

            IFS=$'\t' read -r ELAPSED USER_TIME SYSTEM_TIME MAX_RSS TIME_EXIT < "$TIME_FILE"
            STATUS='COMPLETED'
            if [ "$COMMAND_RC" -ne 0 ]; then
              STATUS="FAILED_RC_${COMMAND_RC}"
            elif [ ! -s "$OUTPUT_DIR/streme.txt" ]; then
              STATUS='FAILED_NO_RESULT'
            fi

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$MOTIF_LENGTH" \
              "$STATUS" \
              "$ELAPSED" \
              "$USER_TIME" \
              "$SYSTEM_TIME" \
              "$MAX_RSS" \
              "$COMMAND_RC" \
              "$CPU_MODEL" \
              "$STREME_VERSION" \
              >> benchmark/result/streme_dna1_seed0.tsv

            if [ "$STATUS" != 'COMPLETED' ]; then
              cat "$LOG_FILE"
              exit 1
            fi
          done

          cat benchmark/result/streme_dna1_seed0.tsv

      - name: Upload STREME measurements
        uses: actions/upload-artifact@v4
        with:
          name: streme-dna1-seed0-rerun
          path: benchmark/result
          retention-days: 1
          compression-level: 6
