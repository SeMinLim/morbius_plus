name: Temporary STREME DNA1 Seed0 W16 Rerun

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-streme-dna1-seed0-rerun.yml'

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Install STREME 5.5.9
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: streme-benchmark
          create-args: >-
            -c conda-forge
            -c bioconda
            meme=5.5.9
          cache-environment: true
          init-shell: bash

      - name: Download exact synthetic DNA dataset
        uses: actions/download-artifact@v4
        with:
          name: prosampler-benchmark-package
          path: benchmark/package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SeMinLim/morbius_plus
          run-id: 31936768291

      - name: Configure swap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p benchmark/result
          {
            echo '=== before swap ==='
            free -h
            df -h /
            swapon --show || true
          } > benchmark/result/swap_setup.txt

          FREE_BYTES="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
          RESERVE_BYTES=$((12 * 1024 * 1024 * 1024))
          MAX_SWAP_BYTES=$((48 * 1024 * 1024 * 1024))
          FILE_SWAP_BYTES=$((FREE_BYTES - RESERVE_BYTES))

          if [ "$FILE_SWAP_BYTES" -gt "$MAX_SWAP_BYTES" ]; then
            FILE_SWAP_BYTES="$MAX_SWAP_BYTES"
          fi

          if [ "$FILE_SWAP_BYTES" -ge $((8 * 1024 * 1024 * 1024)) ]; then
            sudo fallocate -l "$FILE_SWAP_BYTES" /swapfile-streme
            sudo chmod 600 /swapfile-streme
            sudo mkswap /swapfile-streme
            sudo swapon -p 10 /swapfile-streme
            sudo sysctl -w vm.swappiness=100 || true
            sudo sysctl -w vm.page-cluster=0 || true
          fi

          {
            echo
            echo '=== after swap ==='
            free -h
            df -h /
            swapon --show || true
          } >> benchmark/result/swap_setup.txt

      - name: Run single-core STREME measurement
        shell: micromamba-shell {0}
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -u

          mkdir -p benchmark/result benchmark/output

          INPUT_FILE='benchmark/package/DATASET_DNA_1.fa'
          MOTIF_LENGTH='16'
          OUTPUT_DIR='benchmark/output/W16'
          TIME_FILE='benchmark/result/time.tsv'
          LOG_FILE='benchmark/result/run.log'
          STREME_BIN="$(command -v streme)"
          CPU_ALLOWED="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          CPU_ID="$(printf '%s' "$CPU_ALLOWED" | cut -d',' -f1 | cut -d'-' -f1)"
          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"
          STREME_VERSION="$($STREME_BIN --version 2>&1 | head -n 1)"

          sha256sum "$INPUT_FILE" > benchmark/result/input_checksum.sha256
          {
            echo "CPU model       : $CPU_MODEL"
            echo "CPU allowed     : $CPU_ALLOWED"
            echo "Pinned CPU      : $CPU_ID"
            echo "STREME version  : $STREME_VERSION"
            echo "Input           : DATASET_DNA_1.fa"
            echo "Input SHA-256   : $(sha256sum "$INPUT_FILE" | awk '{print $1}')"
            echo "Motif length    : $MOTIF_LENGTH"
            echo "Parameters      : --dna --w 16 --nmotifs 1 --order 2 --seed 0"
            echo "Strand mode     : standard DNA search including reverse complements"
          } > benchmark/result/environment.txt

          sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true

          set +e
          /usr/bin/time \
            -f '%e\t%U\t%S\t%M\t%x' \
            -o "$TIME_FILE" \
            taskset -c "$CPU_ID" \
            "$STREME_BIN" \
              --p "$INPUT_FILE" \
              --dna \
              --w 16 \
              --nmotifs 1 \
              --order 2 \
              --seed 0 \
              --oc "$OUTPUT_DIR" \
            > "$LOG_FILE" 2>&1
          COMMAND_RC=$?
          set -e

          ELAPSED='NA'
          USER_TIME='NA'
          SYSTEM_TIME='NA'
          MAX_RSS='NA'
          if [ -s "$TIME_FILE" ]; then
            IFS=$'\t' read -r ELAPSED USER_TIME SYSTEM_TIME MAX_RSS TIME_EXIT < "$TIME_FILE"
          fi

          STATUS='COMPLETED'
          if [ "$COMMAND_RC" -ne 0 ]; then
            STATUS="FAILED_RC_${COMMAND_RC}"
          elif [ ! -s "$OUTPUT_DIR/streme.txt" ]; then
            STATUS='FAILED_NO_RESULT'
          fi

          printf 'motif_length\tstatus\telapsed_seconds\tuser_seconds\tsystem_seconds\tmax_rss_kb\texit_code\tcpu_model\tstreme_version\n' \
            > benchmark/result/result.tsv
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$MOTIF_LENGTH" \
            "$STATUS" \
            "$ELAPSED" \
            "$USER_TIME" \
            "$SYSTEM_TIME" \
            "$MAX_RSS" \
            "$COMMAND_RC" \
            "$CPU_MODEL" \
            "$STREME_VERSION" \
            >> benchmark/result/result.tsv

          {
            echo
            echo '=== after measurement ==='
            free -h
            swapon --show || true
          } >> benchmark/result/swap_setup.txt

          cat benchmark/result/result.tsv
          exit "$COMMAND_RC"

      - name: Upload STREME measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streme-dna1-seed0-W16-swap
          path: benchmark/result
          retention-days: 1
          compression-level: 6
