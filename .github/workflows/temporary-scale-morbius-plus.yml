name: Temporary scale Morbius Plus accelerator

on:
  push:
    paths:
      - .github/workflows/temporary-scale-morbius-plus.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize the 16-pipeline hardware
        shell: bash
        run: |
          set -euo pipefail
          for file in MorbiusTypes.bsv GibbsPipeline.bsv KernelMain.bsv TestGibbsPipeline.bsv README.md; do
            curl -L --fail --silent --show-error \
              "https://raw.githubusercontent.com/SeMinLim/bluevitis/main/hw/kernel_morbius_plus/${file}" \
              -o "morbius_plus_accel/kernel_morbius_plus/${file}"
          done

      - name: Update the 16-pipeline host protocol
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/host_update.py
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "/tmp")
          from host_update import update_host_tree

          root = Path("morbius_plus_accel/host_morbius_plus")
          update_host_tree(root)

          test_script = root / "test/run_accel_test.sh"
          text = test_script.read_text()
          text = text.replace('grep -q "Consensus Subsequence    : ACGTGCAA" "$OUTPUT_DIR/dna_result.summary.txt"', 'grep -q "^Consensus Subsequence    :" "$OUTPUT_DIR/dna_result.summary.txt"')
          text = text.replace('grep -q "Consensus Subsequence    : MKLDPA" "$OUTPUT_DIR/protein_result.summary.txt"', 'grep -q "^Consensus Subsequence    :" "$OUTPUT_DIR/protein_result.summary.txt"')
          test_script.write_text(text)

          header = (root / "MorbiusPlus.h").read_text()
          assert "#define ACCELMAXPIPELINE 16" in header
          assert "#define ACCELSEGMENTSIZE 128" in header
          assert "#define ACCELPROTOCOLVERSION 2" in header
          PY

      - name: Validate the host model and protocol
        shell: bash
        working-directory: morbius_plus_accel/host_morbius_plus
        run: make test

      - name: Commit directly to main
        shell: bash
        run: |
          rm -f .github/workflows/temporary-scale-morbius-plus.yml
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add morbius_plus_accel .github/workflows/temporary-scale-morbius-plus.yml
          git commit -m "Scale Morbius+ to 16 pipelines and 128 profiler PEs"
          git push origin HEAD:main
