name: Temporary Morbius Plus SW DNA3 Benchmark

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-morbius-plus-sw-dna3.yml'

permissions:
  contents: write

concurrency:
  group: temporary-morbius-plus-sw-dna3
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish benchmark run status
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p temporary_results
          {
            echo "Run ID          : $GITHUB_RUN_ID"
            echo "Run attempt     : $GITHUB_RUN_ATTEMPT"
            echo "Runner image    : ubuntu-24.04"
            echo "Source commit   : $GITHUB_SHA"
            echo "Configuration   : 16 pipelines, 1 CPU thread, score threshold 0.90, seed 1"
            echo "State           : PREPARING"
          } > temporary_results/morbius_plus_sw_dna3_status.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temporary_results/morbius_plus_sw_dna3_status.txt
          git commit -m 'Record temporary Morbius+ DNA3 benchmark run' || true
          git push

      - name: Generate and validate exact DATASET_DNA_3
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p benchmark/input benchmark/generated benchmark/package benchmark/metadata

          curl -fL --retry 5 --retry-delay 3 \
            'https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/upstream5000.fa.gz' \
            -o benchmark/input/upstream5000.fa.gz
          gunzip -c benchmark/input/upstream5000.fa.gz \
            > benchmark/input/upstream5000.fa

          curl -fL --retry 5 --retry-delay 3 \
            'https://jaspar2020.genereg.net/download/data/2020/sites/MA0007.2.sites' \
            -o benchmark/input/MA0007.2_sites.fasta

          echo '4b2f7d939bfcbe9bf5194df7ebf9c58bc5b443dcf43c47877d1949ad17d85ef3  benchmark/input/upstream5000.fa' \
            | sha256sum -c -
          echo 'b2cfd18e34f7ed8362813b175b1db984946b396a03aaca4e4b4ca91f0a012dac  benchmark/input/MA0007.2_sites.fasta' \
            | sha256sum -c -

          git checkout fcacf983fe223dc442503a858070730a5278aa1f -- \
            synthethic_dataset_generator

          make -C synthethic_dataset_generator clean all
          ./synthethic_dataset_generator/synthethic_dataset_generator \
            --background benchmark/input/upstream5000.fa \
            --binding-sites benchmark/input/MA0007.2_sites.fasta \
            --output benchmark/generated \
            --seed 1 \
            > benchmark/metadata/dataset_generation.log 2>&1

          mv benchmark/generated/DATASET_DNA_3.fasta \
            benchmark/package/DATASET_DNA_3.fa

          echo '499253156c097fff89c6bc7a36acf21ea3d1043c16577a930a6a00ca92addd22  benchmark/package/DATASET_DNA_3.fa' \
            | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path

          path = Path('benchmark/package/DATASET_DNA_3.fa')
          record_num = 0
          sequence_lengths = set()
          current_length = 0

          with path.open() as input_file:
              for raw_line in input_file:
                  line = raw_line.strip()
                  if not line:
                      continue
                  if line.startswith('>'):
                      if record_num > 0:
                          sequence_lengths.add(current_length)
                      record_num += 1
                      current_length = 0
                  else:
                      if not set(line.upper()).issubset({'A', 'C', 'G', 'T'}):
                          raise RuntimeError('Invalid DNA alphabet')
                      current_length += len(line)

          if record_num > 0:
              sequence_lengths.add(current_length)

          if record_num != 131072:
              raise RuntimeError(f'Expected 131072 records, found {record_num}')
          if sequence_lengths != {1000}:
              raise RuntimeError(f'Unexpected sequence lengths: {sequence_lengths}')
          PY

          sha256sum benchmark/package/DATASET_DNA_3.fa \
            > benchmark/metadata/input_checksum.sha256

      - name: Upload validated dataset
        uses: actions/upload-artifact@v4
        with:
          name: morbius-plus-sw-dna3-input
          path: benchmark/package/DATASET_DNA_3.fa
          retention-days: 1
          compression-level: 6

      - name: Upload preparation metadata
        uses: actions/upload-artifact@v4
        with:
          name: morbius-plus-sw-dna3-preparation
          path: benchmark/metadata
          retention-days: 7
          compression-level: 6

  benchmark:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        motif_length: [4, 8, 16, 32, 64, 128]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download validated dataset
        uses: actions/download-artifact@v4
        with:
          name: morbius-plus-sw-dna3-input
          path: benchmark/input

      - name: Require AMD EPYC 9V74
        shell: bash
        run: |
          set -euo pipefail

          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"
          if [[ "$CPU_MODEL" != *"AMD EPYC 9V74"* ]]; then
            echo "Required CPU is AMD EPYC 9V74, but runner supplied: $CPU_MODEL"
            exit 78
          fi

      - name: Build Morbius Plus software
        shell: bash
        run: |
          set -euo pipefail

          make -C morbius_plus_vanila clean
          make -C morbius_plus_vanila

      - name: Measure one motif length on one CPU core
        shell: bash
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          MALLOC_ARENA_MAX: 2
        run: |
          set -euo pipefail

          MOTIF_LENGTH='${{ matrix.motif_length }}'
          INPUT_FILE="$PWD/benchmark/input/DATASET_DNA_3.fa"
          EXECUTABLE="$PWD/morbius_plus_vanila/morbius_plus_vanila"
          OUTPUT_DIR="$PWD/benchmark/output/W${MOTIF_LENGTH}"
          OUTPUT_PREFIX="$OUTPUT_DIR/result"
          RESULT_DIR="$PWD/benchmark/result"
          LOG_FILE="$RESULT_DIR/run.log"
          TIME_FILE="$RESULT_DIR/time.tsv"
          CPU_ALLOWED="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          CPU_ID="$(printf '%s' "$CPU_ALLOWED" | cut -d',' -f1 | cut -d'-' -f1)"
          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"

          mkdir -p "$OUTPUT_DIR" "$RESULT_DIR"

          {
            echo "Run ID          : $GITHUB_RUN_ID"
            echo "Run attempt     : $GITHUB_RUN_ATTEMPT"
            echo "CPU model       : $CPU_MODEL"
            echo "CPU allowed     : $CPU_ALLOWED"
            echo "Pinned CPU      : $CPU_ID"
            echo "Runner image    : ubuntu-24.04"
            echo "Source commit   : $GITHUB_SHA"
            echo "Compiler        : $(g++ --version | head -n 1)"
            echo "Motif length    : $MOTIF_LENGTH"
            echo "Configuration   : 16 pipelines, 1 CPU thread, score threshold 0.90, seed 1"
          } > "$RESULT_DIR/environment.txt"

          sha256sum "$INPUT_FILE" > "$RESULT_DIR/input_checksum.sha256"

          sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true

          set +e
          /usr/bin/time \
            -f '%e\t%U\t%S\t%M\t%x' \
            -o "$TIME_FILE" \
            timeout --signal=TERM --kill-after=60s 10800s \
            taskset -c "$CPU_ID" \
            "$EXECUTABLE" \
              --input "$INPUT_FILE" \
              --output "$OUTPUT_PREFIX" \
              --alphabet dna \
              --motif-length "$MOTIF_LENGTH" \
              --pipelines 16 \
              --score-threshold 0.90 \
              --seed 1 \
              --threads 1 \
            > "$LOG_FILE" 2>&1
          COMMAND_RC=$?
          set -e

          WALL_TIME='NA'
          USER_TIME='NA'
          SYSTEM_TIME='NA'
          MAX_RSS='NA'
          if [ -s "$TIME_FILE" ]; then
            IFS=$'\t' read -r WALL_TIME USER_TIME SYSTEM_TIME MAX_RSS TIME_EXIT < "$TIME_FILE"
          fi

          INTERNAL_TIME="$(awk -F: '/Elapsed Time[[:space:]]*:/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' "$LOG_FILE")"
          STATUS='COMPLETED'
          if [ "$COMMAND_RC" -eq 124 ] || [ "$COMMAND_RC" -eq 137 ]; then
            STATUS='TIMEOUT_10800S'
          elif [ "$COMMAND_RC" -ne 0 ]; then
            STATUS="FAILED_RC_${COMMAND_RC}"
          elif [ -z "$INTERNAL_TIME" ]; then
            STATUS='FAILED_NO_INTERNAL_TIME'
          elif [ ! -s "${OUTPUT_PREFIX}.summary.txt" ]; then
            STATUS='FAILED_NO_RESULT'
          fi

          printf 'motif_length\tstatus\twall_seconds\tinternal_seconds\tuser_seconds\tsystem_seconds\tmax_rss_kb\texit_code\tcpu_model\n' \
            > "$RESULT_DIR/result.tsv"
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$MOTIF_LENGTH" \
            "$STATUS" \
            "$WALL_TIME" \
            "$INTERNAL_TIME" \
            "$USER_TIME" \
            "$SYSTEM_TIME" \
            "$MAX_RSS" \
            "$COMMAND_RC" \
            "$CPU_MODEL" \
            >> "$RESULT_DIR/result.tsv"

          grep -E 'Seed Initialization Time|Elapsed Time|Best Pipeline|Best Normalized Score|Threshold Reached' \
            "$LOG_FILE" \
            > "$RESULT_DIR/summary.txt" || true

          cat "$RESULT_DIR/result.tsv"

          if [ "$STATUS" != 'COMPLETED' ]; then
            cat "$LOG_FILE"
            exit 1
          fi

      - name: Upload one measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morbius-plus-sw-dna3-W${{ matrix.motif_length }}
          path: benchmark/result
          retention-days: 7
          compression-level: 6

  collect:
    needs: benchmark
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download measurement artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: morbius-plus-sw-dna3-W*
          path: collected
          merge-multiple: false

      - name: Aggregate and validate measurements
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p final
          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = []
          for path in Path('collected').rglob('result.tsv'):
              with path.open(newline='') as input_file:
                  rows.extend(csv.DictReader(input_file, delimiter='\t'))

          rows.sort(key=lambda row: int(row['motif_length']))
          required = [4, 8, 16, 32, 64, 128]

          if [int(row['motif_length']) for row in rows] != required:
              raise RuntimeError(
                  f'Expected motif lengths {required}, found '
                  f'{[row["motif_length"] for row in rows]}'
              )

          for row in rows:
              if row['status'] != 'COMPLETED':
                  raise RuntimeError(
                      f'Width {row["motif_length"]} has status {row["status"]}'
                  )
              if 'AMD EPYC 9V74' not in row['cpu_model']:
                  raise RuntimeError(
                      f'Unexpected CPU for width {row["motif_length"]}: '
                      f'{row["cpu_model"]}'
                  )

          fields = [
              'motif_length',
              'status',
              'wall_seconds',
              'internal_seconds',
              'user_seconds',
              'system_seconds',
              'max_rss_kb',
              'exit_code',
              'cpu_model',
          ]

          with Path('final/morbius_plus_sw_dna3.tsv').open('w', newline='') as output_file:
              writer = csv.DictWriter(
                  output_file,
                  fieldnames=fields,
                  delimiter='\t',
                  lineterminator='\n',
              )
              writer.writeheader()
              writer.writerows(rows)
          PY

          cp -a collected final/individual_measurements
          cat final/morbius_plus_sw_dna3.tsv

      - name: Publish completed measurements
        shell: bash
        run: |
          set -euo pipefail

          git pull --rebase origin main

          DESTINATION='temporary_results/morbius_plus_sw_dna3_benchmark'
          rm -rf "$DESTINATION"
          mkdir -p "$DESTINATION"

          cp final/morbius_plus_sw_dna3.tsv "$DESTINATION/"

          for WIDTH in 4 8 16 32 64 128; do
            SOURCE_DIR="final/individual_measurements/morbius-plus-sw-dna3-W${WIDTH}"
            cp "$SOURCE_DIR/environment.txt" "$DESTINATION/environment_W${WIDTH}.txt"
            cp "$SOURCE_DIR/input_checksum.sha256" "$DESTINATION/input_checksum_W${WIDTH}.sha256"
            cp "$SOURCE_DIR/summary.txt" "$DESTINATION/summary_W${WIDTH}.txt"
          done

          {
            echo "Run ID          : $GITHUB_RUN_ID"
            echo "Run attempt     : $GITHUB_RUN_ATTEMPT"
            echo "Configuration   : 16 pipelines, 1 CPU thread, score threshold 0.90, seed 1"
            echo "State           : COMPLETED"
          } > temporary_results/morbius_plus_sw_dna3_status.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temporary_results/morbius_plus_sw_dna3_status.txt "$DESTINATION"
          git commit -m 'Store temporary Morbius+ DNA3 measurements'
          git push

      - name: Upload complete measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morbius-plus-sw-dna3-results
          path: final
          retention-days: 7
          compression-level: 6
