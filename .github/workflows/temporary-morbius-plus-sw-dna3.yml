name: Temporary Morbius Plus SW DNA3 Benchmark

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-morbius-plus-sw-dna3.yml'

permissions:
  contents: write

concurrency:
  group: temporary-morbius-plus-sw-dna3
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record and publish execution environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p benchmark/input benchmark/generated benchmark/result benchmark/output temporary_results

          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"
          CPU_ALLOWED="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          CPU_ID="$(printf '%s' "$CPU_ALLOWED" | cut -d',' -f1 | cut -d'-' -f1)"

          {
            echo "Run ID          : $GITHUB_RUN_ID"
            echo "Run attempt     : $GITHUB_RUN_ATTEMPT"
            echo "CPU model       : $CPU_MODEL"
            echo "CPU allowed     : $CPU_ALLOWED"
            echo "Pinned CPU      : $CPU_ID"
            echo "Runner image    : ubuntu-24.04"
            echo "Source commit   : $GITHUB_SHA"
            echo "Compiler        : $(g++ --version | head -n 1)"
            echo "Configuration   : 16 pipelines, 1 CPU thread, score threshold 0.90, seed 1"
            echo "State           : CPU_ASSIGNED"
          } | tee benchmark/result/environment.txt

          cp benchmark/result/environment.txt \
            temporary_results/morbius_plus_sw_dna3_status.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temporary_results/morbius_plus_sw_dna3_status.txt
          git commit -m 'Record temporary Morbius+ DNA3 benchmark runner' || true
          git push

      - name: Require AMD EPYC 9V74
        shell: bash
        run: |
          set -euo pipefail

          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"
          if [[ "$CPU_MODEL" != *"AMD EPYC 9V74"* ]]; then
            echo "Required CPU is AMD EPYC 9V74, but runner supplied: $CPU_MODEL"
            exit 78
          fi

      - name: Generate exact DATASET_DNA_3
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 5 --retry-delay 3 \
            'https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/upstream5000.fa.gz' \
            -o benchmark/input/upstream5000.fa.gz
          gunzip -c benchmark/input/upstream5000.fa.gz \
            > benchmark/input/upstream5000.fa

          curl -fL --retry 5 --retry-delay 3 \
            'https://jaspar2020.genereg.net/download/data/2020/sites/MA0007.2.sites' \
            -o benchmark/input/MA0007.2_sites.fasta

          echo '4b2f7d939bfcbe9bf5194df7ebf9c58bc5b443dcf43c47877d1949ad17d85ef3  benchmark/input/upstream5000.fa' \
            | sha256sum -c -
          echo 'b2cfd18e34f7ed8362813b175b1db984946b396a03aaca4e4b4ca91f0a012dac  benchmark/input/MA0007.2_sites.fasta' \
            | sha256sum -c -

          git checkout fcacf983fe223dc442503a858070730a5278aa1f -- \
            synthethic_dataset_generator

          make -C synthethic_dataset_generator clean all
          ./synthethic_dataset_generator/synthethic_dataset_generator \
            --background benchmark/input/upstream5000.fa \
            --binding-sites benchmark/input/MA0007.2_sites.fasta \
            --output benchmark/generated \
            --seed 1 \
            > benchmark/result/dataset_generation.log 2>&1

          mv benchmark/generated/DATASET_DNA_3.fasta \
            benchmark/input/DATASET_DNA_3.fa

          echo '499253156c097fff89c6bc7a36acf21ea3d1043c16577a930a6a00ca92addd22  benchmark/input/DATASET_DNA_3.fa' \
            | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path

          path = Path('benchmark/input/DATASET_DNA_3.fa')
          record_num = 0
          sequence_lengths = set()
          current_length = 0

          with path.open() as input_file:
              for raw_line in input_file:
                  line = raw_line.strip()
                  if not line:
                      continue
                  if line.startswith('>'):
                      if record_num > 0:
                          sequence_lengths.add(current_length)
                      record_num += 1
                      current_length = 0
                  else:
                      if not set(line.upper()).issubset({'A', 'C', 'G', 'T'}):
                          raise RuntimeError('Invalid DNA alphabet')
                      current_length += len(line)

          if record_num > 0:
              sequence_lengths.add(current_length)

          if record_num != 131072:
              raise RuntimeError(f'Expected 131072 records, found {record_num}')
          if sequence_lengths != {1000}:
              raise RuntimeError(f'Unexpected sequence lengths: {sequence_lengths}')
          PY

          sha256sum benchmark/input/DATASET_DNA_3.fa \
            > benchmark/result/input_checksum.sha256

      - name: Build Morbius Plus software
        shell: bash
        run: |
          set -euo pipefail

          git restore synthethic_dataset_generator
          make -C morbius_plus_vanila clean
          make -C morbius_plus_vanila

      - name: Measure all motif lengths on one CPU core
        shell: bash
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          MALLOC_ARENA_MAX: 2
        run: |
          set -euo pipefail

          INPUT_FILE="$PWD/benchmark/input/DATASET_DNA_3.fa"
          EXECUTABLE="$PWD/morbius_plus_vanila/morbius_plus_vanila"
          CPU_ALLOWED="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          CPU_ID="$(printf '%s' "$CPU_ALLOWED" | cut -d',' -f1 | cut -d'-' -f1)"
          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"

          printf 'motif_length\tstatus\twall_seconds\tinternal_seconds\tuser_seconds\tsystem_seconds\tmax_rss_kb\texit_code\tcpu_model\n' \
            > benchmark/result/morbius_plus_sw_dna3.tsv

          for MOTIF_LENGTH in 4 8 16 32 64 128; do
            OUTPUT_DIR="$PWD/benchmark/output/W${MOTIF_LENGTH}"
            OUTPUT_PREFIX="$OUTPUT_DIR/result"
            LOG_FILE="$PWD/benchmark/result/run_W${MOTIF_LENGTH}.log"
            TIME_FILE="$PWD/benchmark/result/time_W${MOTIF_LENGTH}.tsv"

            rm -rf "$OUTPUT_DIR"
            mkdir -p "$OUTPUT_DIR"
            sync
            sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true

            set +e
            /usr/bin/time \
              -f '%e\t%U\t%S\t%M\t%x' \
              -o "$TIME_FILE" \
              timeout --signal=TERM --kill-after=60s 10800s \
              taskset -c "$CPU_ID" \
              "$EXECUTABLE" \
                --input "$INPUT_FILE" \
                --output "$OUTPUT_PREFIX" \
                --alphabet dna \
                --motif-length "$MOTIF_LENGTH" \
                --pipelines 16 \
                --score-threshold 0.90 \
                --seed 1 \
                --threads 1 \
              > "$LOG_FILE" 2>&1
            COMMAND_RC=$?
            set -e

            WALL_TIME='NA'
            USER_TIME='NA'
            SYSTEM_TIME='NA'
            MAX_RSS='NA'
            if [ -s "$TIME_FILE" ]; then
              IFS=$'\t' read -r WALL_TIME USER_TIME SYSTEM_TIME MAX_RSS TIME_EXIT < "$TIME_FILE"
            fi

            INTERNAL_TIME="$(awk -F: '/Elapsed Time[[:space:]]*:/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' "$LOG_FILE")"
            STATUS='COMPLETED'
            if [ "$COMMAND_RC" -eq 124 ] || [ "$COMMAND_RC" -eq 137 ]; then
              STATUS='TIMEOUT_10800S'
            elif [ "$COMMAND_RC" -ne 0 ]; then
              STATUS="FAILED_RC_${COMMAND_RC}"
            elif [ -z "$INTERNAL_TIME" ]; then
              STATUS='FAILED_NO_INTERNAL_TIME'
            elif [ ! -s "${OUTPUT_PREFIX}.summary.txt" ]; then
              STATUS='FAILED_NO_RESULT'
            fi

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$MOTIF_LENGTH" \
              "$STATUS" \
              "$WALL_TIME" \
              "$INTERNAL_TIME" \
              "$USER_TIME" \
              "$SYSTEM_TIME" \
              "$MAX_RSS" \
              "$COMMAND_RC" \
              "$CPU_MODEL" \
              >> benchmark/result/morbius_plus_sw_dna3.tsv

            grep -E 'Seed Initialization Time|Elapsed Time|Best Pipeline|Best Normalized Score|Threshold Reached' \
              "$LOG_FILE" \
              > "$PWD/benchmark/result/summary_W${MOTIF_LENGTH}.txt" || true

            rm -rf "$OUTPUT_DIR"

            if [ "$STATUS" != 'COMPLETED' ]; then
              cat "$LOG_FILE"
              exit 1
            fi
          done

          echo '=== FINAL MEASUREMENTS ==='
          cat benchmark/result/morbius_plus_sw_dna3.tsv

      - name: Publish completed measurements
        shell: bash
        run: |
          set -euo pipefail

          DESTINATION='temporary_results/morbius_plus_sw_dna3_benchmark'
          rm -rf "$DESTINATION"
          mkdir -p "$DESTINATION"

          cp benchmark/result/morbius_plus_sw_dna3.tsv "$DESTINATION/"
          cp benchmark/result/environment.txt "$DESTINATION/"
          cp benchmark/result/input_checksum.sha256 "$DESTINATION/"
          cp benchmark/result/summary_W*.txt "$DESTINATION/"

          printf '\nState           : COMPLETED\n' \
            >> temporary_results/morbius_plus_sw_dna3_status.txt

          git add temporary_results/morbius_plus_sw_dna3_status.txt "$DESTINATION"
          git commit -m 'Store temporary Morbius+ DNA3 measurements'
          git push

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morbius-plus-sw-dna3-results
          path: benchmark/result
          retention-days: 7
          compression-level: 6
