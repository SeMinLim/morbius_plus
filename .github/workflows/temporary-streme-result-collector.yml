name: Temporary STREME Result Collector

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-streme-result-collector.yml'

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for benchmark and collect all measurement artifacts
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW_PATH='temporary-streme-performance.yml'
          RUN_ID="$(gh api \
            "/repos/${REPOSITORY}/actions/workflows/${WORKFLOW_PATH}/runs?per_page=10" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id')"

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = 'null' ]; then
            echo 'No STREME benchmark workflow run was found.' >&2
            exit 1
          fi

          echo "Watching STREME workflow run $RUN_ID"
          while true; do
            STATUS="$(gh api "/repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status')"
            CONCLUSION="$(gh api "/repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // "pending"')"
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') status=${STATUS} conclusion=${CONCLUSION}"
            if [ "$STATUS" = 'completed' ]; then
              break
            fi
            sleep 60
          done

          mkdir -p collected final temporary_results
          gh api "/repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            > collected/artifacts.json

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          repository = __import__('os').environ['REPOSITORY']
          data = json.loads(Path('collected/artifacts.json').read_text())
          artifacts = [
              artifact for artifact in data.get('artifacts', [])
              if artifact['name'].startswith('streme-DNA')
          ]
          print(f'Found {len(artifacts)} individual STREME artifacts.')
          for artifact in artifacts:
              artifact_id = artifact['id']
              artifact_name = artifact['name']
              zip_path = Path('collected') / f'{artifact_name}.zip'
              output_dir = Path('collected') / artifact_name
              output_dir.mkdir(parents=True, exist_ok=True)
              with zip_path.open('wb') as output_file:
                  subprocess.run(
                      [
                          'gh', 'api',
                          f'/repos/{repository}/actions/artifacts/{artifact_id}/zip',
                      ],
                      check=True,
                      stdout=output_file,
                  )
              subprocess.run(
                  ['unzip', '-q', str(zip_path), '-d', str(output_dir)],
                  check=True,
              )
          PY

          RUN_CONCLUSION="$(gh api "/repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // "unknown"')"
          export RUN_ID RUN_CONCLUSION

          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          expected = [
              (dataset, width)
              for dataset in (1, 2, 3)
              for width in (4, 8, 16)
          ]
          rows_by_key = {}
          for path in Path('collected').rglob('result.tsv'):
              with path.open(newline='') as input_file:
                  for row in csv.DictReader(input_file, delimiter='\t'):
                      key = (
                          int(row['dataset'].rsplit('_', 1)[1]),
                          int(row['motif_length']),
                      )
                      rows_by_key[key] = row

          fields = [
              'dataset',
              'motif_length',
              'status',
              'elapsed_seconds',
              'user_seconds',
              'system_seconds',
              'max_rss_kb',
              'exit_code',
              'cpu_model',
              'streme_version',
          ]
          rows = []
          for dataset, width in expected:
              row = rows_by_key.get((dataset, width))
              if row is None:
                  row = {
                      'dataset': f'DATASET_DNA_{dataset}',
                      'motif_length': str(width),
                      'status': 'MISSING_ARTIFACT_OR_RUNNER_FAILURE',
                      'elapsed_seconds': 'NA',
                      'user_seconds': 'NA',
                      'system_seconds': 'NA',
                      'max_rss_kb': 'NA',
                      'exit_code': 'NA',
                      'cpu_model': 'NA',
                      'streme_version': 'NA',
                  }
              rows.append(row)

          result_path = Path('temporary_results/streme_elapsed_time.tsv')
          with result_path.open('w', newline='') as output_file:
              writer = csv.DictWriter(
                  output_file,
                  fieldnames=fields,
                  delimiter='\t',
                  lineterminator='\n',
              )
              writer.writeheader()
              writer.writerows(rows)

          metadata_path = Path('temporary_results/streme_benchmark_metadata.txt')
          metadata_path.write_text(
              f"workflow_run_id={os.environ['RUN_ID']}\n"
              f"workflow_conclusion={os.environ['RUN_CONCLUSION']}\n"
              'streme_version=MEME Suite 5.3.0 package\n'
              'single_core=taskset pinning plus thread environment limits\n'
              'motif_number=1\n'
              'motif_width=fixed by --minw and --maxw\n'
              'strand=forward only (--norc)\n'
              'negative_set=STREME-generated shuffled controls\n'
              'random_seed=1\n'
              'timeout_seconds=14400\n'
          )

          print(result_path.read_text())
          PY

      - name: Commit collected result to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add temporary_results/streme_elapsed_time.tsv \
                  temporary_results/streme_benchmark_metadata.txt
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
            exit 0
          fi
          git commit -m 'Record temporary STREME benchmark results'
          git push origin HEAD:main
