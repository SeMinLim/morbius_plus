name: Temporary Export BSC

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-export-bsc.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Download official Bluespec compiler release
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o bsc-2026.01-debian-12.13.tar.gz \
            https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz
          echo '9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3  bsc-2026.01-debian-12.13.tar.gz' | sha256sum -c -

      - name: Upload compiler archive
        uses: actions/upload-artifact@v4
        with:
          name: temporary-bsc-2026.01
          path: bsc-2026.01-debian-12.13.tar.gz
          retention-days: 1
          compression-level: 0
