name: Temporary Export Morbius Plus SW

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-export-morbius-plus-sw.yml'

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record source revision
        run: |
          git rev-parse HEAD > morbius_plus_vanila/SOURCE_COMMIT.txt

      - name: Upload Morbius Plus software source
        uses: actions/upload-artifact@v4
        with:
          name: morbius-plus-sw-source
          path: morbius_plus_vanila
          retention-days: 1
          compression-level: 6
