name: Temporary Export Sources

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-export-sources.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Morbius Plus
        uses: actions/checkout@v4
        with:
          path: morbius_plus

      - name: Check out blueVitis
        uses: actions/checkout@v4
        with:
          repository: SeMinLim/bluevitis
          path: bluevitis

      - name: Package sources
        shell: bash
        run: |
          set -euo pipefail
          tar czf sources.tar.gz morbius_plus bluevitis

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: temporary-sources
          path: sources.tar.gz
          retention-days: 1
          compression-level: 0
