name: Temporary ProSampler Artifact

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-prosampler-artifact.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download and build ProSampler v1.5
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            'https://raw.githubusercontent.com/zhengchangsulab/ProSampler/master/PROSMPLER_v1.5.tar.gz' \
            -o /tmp/PROSMPLER_v1.5.tar.gz
          mkdir -p /tmp/prosampler
          tar -xzf /tmp/PROSMPLER_v1.5.tar.gz -C /tmp/prosampler
          find /tmp/prosampler -maxdepth 3 -type f -printf '%p\n'
          SOURCE="$(find /tmp/prosampler -type f -name 'ProSampler_v1.5.cc' | head -n 1)"
          if [ -z "$SOURCE" ]; then
            SOURCE="$(find /tmp/prosampler -type f -name 'ProSampler*.cc' | head -n 1)"
          fi
          if [ -z "$SOURCE" ]; then
            echo 'ProSampler source was not found.' >&2
            exit 1
          fi
          SOURCE_DIR="$(dirname "$SOURCE")"
          cd "$SOURCE_DIR"
          g++ -O2 -std=gnu++11 -o ProSampler.unix "$(basename "$SOURCE")"
          mkdir -p /tmp/artifact
          cp -a "$SOURCE_DIR"/. /tmp/artifact/
          cp /tmp/PROSMPLER_v1.5.tar.gz /tmp/artifact/

      - name: Upload ProSampler package
        uses: actions/upload-artifact@v4
        with:
          name: ProSampler-v1.5-package
          path: /tmp/artifact
          retention-days: 1
          compression-level: 6
