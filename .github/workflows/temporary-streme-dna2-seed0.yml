name: Temporary STREME DNA2 Seed0 Measurement

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-streme-dna2-seed0.yml'

permissions:
  actions: read
  contents: read

jobs:
  benchmark-short:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Install STREME 5.5.9
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: streme-benchmark
          create-args: >-
            -c conda-forge
            -c bioconda
            meme=5.5.9
          cache-environment: true
          init-shell: bash

      - name: Download exact synthetic DNA dataset
        uses: actions/download-artifact@v4
        with:
          name: prosampler-benchmark-package
          path: benchmark/package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SeMinLim/morbius_plus
          run-id: 31936768291

      - name: Measure motif lengths 4 and 8 on one CPU core
        shell: micromamba-shell {0}
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -euo pipefail

          mkdir -p benchmark/result-short benchmark/output-short

          INPUT_FILE='benchmark/package/DATASET_DNA_2.fa'
          STREME_BIN="$(command -v streme)"
          CPU_ALLOWED="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          CPU_ID="$(printf '%s' "$CPU_ALLOWED" | cut -d',' -f1 | cut -d'-' -f1)"
          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"
          STREME_VERSION="$($STREME_BIN --version 2>&1 | head -n 1)"

          sha256sum "$INPUT_FILE" > benchmark/result-short/input_checksum.sha256
          printf 'motif_length\tstatus\telapsed_seconds\tuser_seconds\tsystem_seconds\tmax_rss_kb\texit_code\tcpu_model\tstreme_version\n' \
            > benchmark/result-short/result.tsv

          {
            echo "CPU model       : $CPU_MODEL"
            echo "CPU allowed     : $CPU_ALLOWED"
            echo "Pinned CPU      : $CPU_ID"
            echo "STREME version  : $STREME_VERSION"
            echo "Input           : DATASET_DNA_2.fa"
            echo "Input SHA-256   : $(sha256sum "$INPUT_FILE" | awk '{print $1}')"
            echo "Parameters      : --dna --w W --nmotifs 1 --order 2 --seed 0"
            echo "Strand mode     : standard DNA search including reverse complements"
          } > benchmark/result-short/environment.txt

          for MOTIF_LENGTH in 4 8; do
            OUTPUT_DIR="benchmark/output-short/W${MOTIF_LENGTH}"
            TIME_FILE="benchmark/result-short/time_W${MOTIF_LENGTH}.tsv"
            LOG_FILE="benchmark/result-short/run_W${MOTIF_LENGTH}.log"

            rm -rf "$OUTPUT_DIR"
            sync
            sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true

            set +e
            /usr/bin/time \
              -f '%e\t%U\t%S\t%M\t%x' \
              -o "$TIME_FILE" \
              taskset -c "$CPU_ID" \
              "$STREME_BIN" \
                --p "$INPUT_FILE" \
                --dna \
                --w "$MOTIF_LENGTH" \
                --nmotifs 1 \
                --order 2 \
                --seed 0 \
                --oc "$OUTPUT_DIR" \
              > "$LOG_FILE" 2>&1
            COMMAND_RC=$?
            set -e

            IFS=$'\t' read -r ELAPSED USER_TIME SYSTEM_TIME MAX_RSS TIME_EXIT < "$TIME_FILE"
            STATUS='COMPLETED'
            if [ "$COMMAND_RC" -ne 0 ]; then
              STATUS="FAILED_RC_${COMMAND_RC}"
            elif [ ! -s "$OUTPUT_DIR/streme.txt" ]; then
              STATUS='FAILED_NO_RESULT'
            fi

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$MOTIF_LENGTH" \
              "$STATUS" \
              "$ELAPSED" \
              "$USER_TIME" \
              "$SYSTEM_TIME" \
              "$MAX_RSS" \
              "$COMMAND_RC" \
              "$CPU_MODEL" \
              "$STREME_VERSION" \
              >> benchmark/result-short/result.tsv

            if [ "$STATUS" != 'COMPLETED' ]; then
              cat "$LOG_FILE"
              exit 1
            fi
          done

          cat benchmark/result-short/result.tsv

      - name: Upload motif lengths 4 and 8 measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streme-dna2-seed0-short
          path: benchmark/result-short
          retention-days: 1
          compression-level: 6

  benchmark-w16:
    runs-on: ubuntu-24.04
    timeout-minutes: 105

    steps:
      - name: Install STREME 5.5.9
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: streme-benchmark
          create-args: >-
            -c conda-forge
            -c bioconda
            meme=5.5.9
          cache-environment: true
          init-shell: bash

      - name: Download exact synthetic DNA dataset
        uses: actions/download-artifact@v4
        with:
          name: prosampler-benchmark-package
          path: benchmark/package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SeMinLim/morbius_plus
          run-id: 31936768291

      - name: Configure swap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p benchmark/result-w16
          {
            echo '=== before swap ==='
            free -h
            df -h /
            swapon --show || true
          } > benchmark/result-w16/swap_setup.txt

          FREE_BYTES="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
          RESERVE_BYTES=$((12 * 1024 * 1024 * 1024))
          MAX_SWAP_BYTES=$((48 * 1024 * 1024 * 1024))
          FILE_SWAP_BYTES=$((FREE_BYTES - RESERVE_BYTES))

          if [ "$FILE_SWAP_BYTES" -gt "$MAX_SWAP_BYTES" ]; then
            FILE_SWAP_BYTES="$MAX_SWAP_BYTES"
          fi

          if [ "$FILE_SWAP_BYTES" -ge $((8 * 1024 * 1024 * 1024)) ]; then
            sudo fallocate -l "$FILE_SWAP_BYTES" /swapfile-streme
            sudo chmod 600 /swapfile-streme
            sudo mkswap /swapfile-streme
            sudo swapon -p 10 /swapfile-streme
            sudo sysctl -w vm.swappiness=100 || true
            sudo sysctl -w vm.page-cluster=0 || true
          fi

          {
            echo
            echo '=== after swap ==='
            free -h
            df -h /
            swapon --show || true
          } >> benchmark/result-w16/swap_setup.txt

      - name: Measure motif length 16 on one CPU core
        shell: micromamba-shell {0}
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          MALLOC_ARENA_MAX: 2
        run: |
          set -u

          mkdir -p benchmark/result-w16 benchmark/output-w16

          INPUT_FILE='benchmark/package/DATASET_DNA_2.fa'
          OUTPUT_DIR='benchmark/output-w16/W16'
          TIME_FILE='benchmark/result-w16/time_W16.tsv'
          LOG_FILE='benchmark/result-w16/run_W16.log'
          STREME_BIN="$(command -v streme)"
          CPU_ALLOWED="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          CPU_ID="$(printf '%s' "$CPU_ALLOWED" | cut -d',' -f1 | cut -d'-' -f1)"
          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"
          STREME_VERSION="$($STREME_BIN --version 2>&1 | head -n 1)"

          sha256sum "$INPUT_FILE" > benchmark/result-w16/input_checksum.sha256
          {
            echo "CPU model       : $CPU_MODEL"
            echo "CPU allowed     : $CPU_ALLOWED"
            echo "Pinned CPU      : $CPU_ID"
            echo "STREME version  : $STREME_VERSION"
            echo "Input           : DATASET_DNA_2.fa"
            echo "Input SHA-256   : $(sha256sum "$INPUT_FILE" | awk '{print $1}')"
            echo "Parameters      : --dna --w 16 --nmotifs 1 --order 2 --seed 0"
            echo "Strand mode     : standard DNA search including reverse complements"
            echo "Time limit      : 5400 seconds"
          } > benchmark/result-w16/environment.txt

          sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true

          set +e
          /usr/bin/time \
            -f '%e\t%U\t%S\t%M\t%x' \
            -o "$TIME_FILE" \
            timeout --signal=TERM --kill-after=60s 5400s \
            taskset -c "$CPU_ID" \
            "$STREME_BIN" \
              --p "$INPUT_FILE" \
              --dna \
              --w 16 \
              --nmotifs 1 \
              --order 2 \
              --seed 0 \
              --oc "$OUTPUT_DIR" \
            > "$LOG_FILE" 2>&1
          COMMAND_RC=$?
          set -e

          ELAPSED='NA'
          USER_TIME='NA'
          SYSTEM_TIME='NA'
          MAX_RSS='NA'
          if [ -s "$TIME_FILE" ]; then
            IFS=$'\t' read -r ELAPSED USER_TIME SYSTEM_TIME MAX_RSS TIME_EXIT < "$TIME_FILE"
          fi

          STATUS='COMPLETED'
          if [ "$COMMAND_RC" -eq 124 ] || [ "$COMMAND_RC" -eq 137 ]; then
            STATUS='TIMEOUT_5400S'
          elif [ "$COMMAND_RC" -ne 0 ]; then
            STATUS="FAILED_RC_${COMMAND_RC}"
          elif [ ! -s "$OUTPUT_DIR/streme.txt" ]; then
            STATUS='FAILED_NO_RESULT'
          fi

          printf 'motif_length\tstatus\telapsed_seconds\tuser_seconds\tsystem_seconds\tmax_rss_kb\texit_code\tcpu_model\tstreme_version\n' \
            > benchmark/result-w16/result.tsv
          printf '16\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$STATUS" \
            "$ELAPSED" \
            "$USER_TIME" \
            "$SYSTEM_TIME" \
            "$MAX_RSS" \
            "$COMMAND_RC" \
            "$CPU_MODEL" \
            "$STREME_VERSION" \
            >> benchmark/result-w16/result.tsv

          {
            echo
            echo '=== after measurement ==='
            free -h
            swapon --show || true
          } >> benchmark/result-w16/swap_setup.txt

          cat benchmark/result-w16/result.tsv

      - name: Upload motif length 16 measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streme-dna2-seed0-w16
          path: benchmark/result-w16
          retention-days: 1
          compression-level: 6

  collect:
    needs:
      - benchmark-short
      - benchmark-w16
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Download measurements
        uses: actions/download-artifact@v4
        with:
          pattern: streme-dna2-seed0-*
          path: collected
          merge-multiple: false

      - name: Aggregate measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final

          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = []
          for path in Path('collected').rglob('result.tsv'):
              with path.open(newline='') as input_file:
                  rows.extend(csv.DictReader(input_file, delimiter='\t'))

          rows.sort(key=lambda row: int(row['motif_length']))
          fields = [
              'motif_length',
              'status',
              'elapsed_seconds',
              'user_seconds',
              'system_seconds',
              'max_rss_kb',
              'exit_code',
              'cpu_model',
              'streme_version',
          ]

          with Path('final/streme_dna2_seed0.tsv').open('w', newline='') as output_file:
              writer = csv.DictWriter(
                  output_file,
                  fieldnames=fields,
                  delimiter='\t',
                  lineterminator='\n',
              )
              writer.writeheader()
              writer.writerows(rows)

          if len(rows) != 3:
              raise RuntimeError(f'Expected 3 measurements, found {len(rows)}')
          PY

          cp -a collected final/individual_measurements
          cat final/streme_dna2_seed0.tsv

      - name: Upload complete measurements
        uses: actions/upload-artifact@v4
        with:
          name: streme-dna2-seed0-results
          path: final
          retention-days: 1
          compression-level: 6
