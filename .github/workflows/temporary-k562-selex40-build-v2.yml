name: Temporary K562 SELEX 40 Dataset Build V2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-k562-selex40-build-v2.yml'

permissions:
  contents: read

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MEME Suite 5.3.0
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: chipseq
          create-args: >-
            -c conda-forge
            -c bioconda
            python=3.9
            meme=5.3.0
          cache-environment: true
          init-shell: bash

      - name: Reuse and fix dataset build script
        shell: micromamba-shell {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/temporary-k562-selex40-build.yml').read_text()
          start_marker = '        run: |\n'
          end_marker = '\n      - name: Upload generated datasets'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)

          lines = workflow[start:end].splitlines()
          script_lines = []
          for line in lines:
              if line.startswith('          '):
                  line = line[10:]
              if line.startswith('JOLMA_PATH='):
                  line = line.replace('| head -n 1)"', '| head -n 1 || true)"')
              script_lines.append(line)

          Path('/tmp/build_k562_selex40.sh').write_text('\n'.join(script_lines) + '\n')
          PY

          bash /tmp/build_k562_selex40.sh

      - name: Upload generated datasets
        uses: actions/upload-artifact@v4
        with:
          name: K562-SELEX-40
          path: output/K562_SELEX_40
          retention-days: 1
          compression-level: 6
