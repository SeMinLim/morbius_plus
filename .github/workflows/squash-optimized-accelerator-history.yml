name: Squash optimized Morbius Plus accelerator history

on:
  push:
    branches: [main]
    paths:
      - 'morbius_plus_accel/kernel_morbius_plus/GibbsLane.bsv'

permissions:
  contents: write

concurrency:
  group: squash-optimized-morbius-accelerator
  cancel-in-progress: false

jobs:
  squash:
    if: github.event.head_commit.message == 'Optimize Morbius+ U50 resource architecture'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify and squash synchronization history
        shell: bash
        run: |
          set -euo pipefail
          KERNEL=morbius_plus_accel/kernel_morbius_plus
          grep -Fq 'package GibbsLane;' "$KERNEL/GibbsLane.bsv"
          grep -Fq 'package PwlArray;' "$KERNEL/PwlArray.bsv"
          grep -Fq 'package SequenceMemory;' "$KERNEL/SequenceMemory.bsv"
          grep -Fq 'typedef 16 NumPipeline;' "$KERNEL/MorbiusTypes.bsv"
          grep -Fq 'typedef 16 NumPE_Profiler;' "$KERNEL/MorbiusTypes.bsv"
          grep -Fq 'typedef 4 NumPE_LPM;' "$KERNEL/MorbiusTypes.bsv"
          ! test -e "$KERNEL/PwlLane.bsv"

          git config user.name 'SeMinLim'
          git config user.email 'seminl1@kookmin.ac.kr'
          git reset --soft 6277c04cee4a882e9bbea796cee035fe114a8d74
          rm -rf .github
          git add -A
          git commit -m 'Optimize Morbius+ U50 resource architecture'
          git push --force origin HEAD:main
