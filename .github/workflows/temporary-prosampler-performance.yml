name: Temporary ProSampler Performance Measurement

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-prosampler-performance.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate exact DNA datasets and build ProSampler
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p benchmark/input benchmark/package benchmark/results

          curl -fL --retry 5 --retry-delay 3 \
            'https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/upstream5000.fa.gz' \
            -o benchmark/input/upstream5000.fa.gz
          gunzip -c benchmark/input/upstream5000.fa.gz \
            > benchmark/input/upstream5000.fa

          curl -fL --retry 5 --retry-delay 3 \
            'https://jaspar2020.genereg.net/download/data/2020/sites/MA0007.2.sites' \
            -o benchmark/input/MA0007.2_sites.fasta

          echo '4b2f7d939bfcbe9bf5194df7ebf9c58bc5b443dcf43c47877d1949ad17d85ef3  benchmark/input/upstream5000.fa' | sha256sum -c -
          echo 'b2cfd18e34f7ed8362813b175b1db984946b396a03aaca4e4b4ca91f0a012dac  benchmark/input/MA0007.2_sites.fasta' | sha256sum -c -

          # These exact DNA files were generated before the later protein-generation
          # revision. Restore the generator revision that created the Drive datasets.
          git checkout fcacf983fe223dc442503a858070730a5278aa1f -- \
            synthethic_dataset_generator

          make -C synthethic_dataset_generator clean all
          ./synthethic_dataset_generator/synthethic_dataset_generator \
            --background benchmark/input/upstream5000.fa \
            --binding-sites benchmark/input/MA0007.2_sites.fasta \
            --output benchmark/generated \
            --seed 1 \
            > benchmark/results/dataset_generation.log 2>&1

          mv benchmark/generated/DATASET_DNA_1.fasta benchmark/package/DATASET_DNA_1.fa
          mv benchmark/generated/DATASET_DNA_2.fasta benchmark/package/DATASET_DNA_2.fa
          mv benchmark/generated/DATASET_DNA_3.fasta benchmark/package/DATASET_DNA_3.fa

          echo '933809e6d428a1cd7e2469345ed79adfa0d270dfe4b9ccc3aea628668567ed17  benchmark/package/DATASET_DNA_1.fa' | sha256sum -c -
          echo '3c540d7ad8f78ab8c6011113e520fc6c40e26b4a593101d4fd6be92b43fde88e  benchmark/package/DATASET_DNA_2.fa' | sha256sum -c -
          echo '499253156c097fff89c6bc7a36acf21ea3d1043c16577a930a6a00ca92addd22  benchmark/package/DATASET_DNA_3.fa' | sha256sum -c -

          curl -fL --retry 5 --retry-delay 3 \
            'https://raw.githubusercontent.com/zhengchangsulab/ProSampler/master/PROSMPLER_v1.5.tar.gz' \
            -o benchmark/input/PROSMPLER_v1.5.tar.gz
          tar -xzf benchmark/input/PROSMPLER_v1.5.tar.gz \
            -C benchmark/input

          PROSAMPLER_SOURCE="$(find benchmark/input -type f -name 'ProSampler_v1.5.cc' -print -quit)"
          if [ -z "$PROSAMPLER_SOURCE" ]; then
            echo 'ProSampler source was not found.' >&2
            exit 1
          fi

          g++ -O2 -std=gnu++11 \
            "$PROSAMPLER_SOURCE" \
            -o benchmark/package/ProSampler.bench

          sha256sum \
            benchmark/package/DATASET_DNA_1.fa \
            benchmark/package/DATASET_DNA_2.fa \
            benchmark/package/DATASET_DNA_3.fa \
            benchmark/package/ProSampler.bench \
            > benchmark/results/package_checksums.sha256

          {
            echo 'Generator commit: fcacf983fe223dc442503a858070730a5278aa1f'
            echo 'ProSampler: v1.5'
            echo 'Compiler:'
            g++ --version | head -n 1
            echo 'Compiler flags: -O2 -std=gnu++11'
          } > benchmark/results/prepare_metadata.txt

      - name: Upload benchmark package
        uses: actions/upload-artifact@v4
        with:
          name: prosampler-benchmark-package
          path: benchmark/package
          retention-days: 1
          compression-level: 6

      - name: Upload preparation metadata
        uses: actions/upload-artifact@v4
        with:
          name: prosampler-preparation-metadata
          path: benchmark/results
          retention-days: 1
          compression-level: 6

  benchmark:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        dataset: [1, 2, 3]
        motif_length: [4, 8, 16, 32, 64, 128]

    steps:
      - name: Download benchmark package
        uses: actions/download-artifact@v4
        with:
          name: prosampler-benchmark-package
          path: benchmark/package

      - name: Run one single-core ProSampler measurement
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p benchmark/result benchmark/output
          chmod +x benchmark/package/ProSampler.bench

          DATASET_ID='${{ matrix.dataset }}'
          MOTIF_LENGTH='${{ matrix.motif_length }}'
          INPUT_FILE="benchmark/package/DATASET_DNA_${DATASET_ID}.fa"
          OUTPUT_PREFIX="benchmark/output/DNA${DATASET_ID}_K${MOTIF_LENGTH}"
          LOG_FILE="benchmark/result/run.log"
          TIME_FILE="benchmark/result/time.tsv"

          CPU_ALLOWED="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          CPU_ID="$(printf '%s' "$CPU_ALLOWED" | cut -d',' -f1 | cut -d'-' -f1)"
          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"

          {
            echo '=== uname ==='
            uname -a
            echo
            echo '=== lscpu ==='
            lscpu
            echo
            echo "Benchmark CPU ID      : $CPU_ID"
            echo "Benchmark CPU allowed : $CPU_ALLOWED"
            echo "Dataset               : DATASET_DNA_${DATASET_ID}.fa"
            echo "Motif length          : $MOTIF_LENGTH"
            echo 'Command parameters    : -b 3 -p 1 -l 0 -f 100 -m 1'
          } > benchmark/result/environment.txt

          TIMEOUT_SECONDS=7200
          if [ "$MOTIF_LENGTH" -eq 128 ]; then
            TIMEOUT_SECONDS=1800
          fi

          sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true

          set +e
          /usr/bin/time \
            -f '%e\t%U\t%S\t%M\t%x' \
            -o "$TIME_FILE" \
            timeout --signal=TERM --kill-after=30s "$TIMEOUT_SECONDS" \
            taskset -c "$CPU_ID" \
            benchmark/package/ProSampler.bench \
              -i "$INPUT_FILE" \
              -b 3 \
              -o "$OUTPUT_PREFIX" \
              -p 1 \
              -k "$MOTIF_LENGTH" \
              -l 0 \
              -f 100 \
              -m 1 \
            > "$LOG_FILE" 2>&1
          COMMAND_RC=$?
          set -e

          ELAPSED='NA'
          USER_TIME='NA'
          SYSTEM_TIME='NA'
          MAX_RSS='NA'
          if [ -s "$TIME_FILE" ]; then
            IFS=$'\t' read -r ELAPSED USER_TIME SYSTEM_TIME MAX_RSS TIME_EXIT < "$TIME_FILE"
          fi

          STATUS='COMPLETED'
          if [ "$COMMAND_RC" -eq 124 ]; then
            STATUS='TIMEOUT'
          elif [ "$COMMAND_RC" -eq 137 ]; then
            STATUS='KILLED_OR_OOM'
          elif [ "$COMMAND_RC" -ne 0 ]; then
            STATUS="FAILED_RC_${COMMAND_RC}"
          fi

          printf 'dataset\tmotif_length\tstatus\telapsed_seconds\tuser_seconds\tsystem_seconds\tmax_rss_kb\texit_code\tcpu_model\n' \
            > benchmark/result/result.tsv
          printf 'DATASET_DNA_%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$DATASET_ID" \
            "$MOTIF_LENGTH" \
            "$STATUS" \
            "$ELAPSED" \
            "$USER_TIME" \
            "$SYSTEM_TIME" \
            "$MAX_RSS" \
            "$COMMAND_RC" \
            "$CPU_MODEL" \
            >> benchmark/result/result.tsv

      - name: Upload one measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosampler-DNA${{ matrix.dataset }}-K${{ matrix.motif_length }}
          path: benchmark/result
          retention-days: 1
          compression-level: 6

  collect:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download measurement artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prosampler-DNA*-K*
          path: collected
          merge-multiple: false

      - name: Aggregate results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final

          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = []
          for path in Path('collected').rglob('result.tsv'):
              with path.open(newline='') as input_file:
                  rows.extend(csv.DictReader(input_file, delimiter='\t'))

          rows.sort(key=lambda row: (int(row['dataset'].rsplit('_', 1)[1]),
                                     int(row['motif_length'])))

          fields = [
              'dataset',
              'motif_length',
              'status',
              'elapsed_seconds',
              'user_seconds',
              'system_seconds',
              'max_rss_kb',
              'exit_code',
              'cpu_model',
          ]
          with Path('final/prosampler_elapsed_time.tsv').open('w', newline='') as output_file:
              writer = csv.DictWriter(output_file,
                                      fieldnames=fields,
                                      delimiter='\t',
                                      lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          if len(rows) != 18:
              raise RuntimeError(f'Expected 18 measurements, found {len(rows)}')
          PY

          cp -a collected final/individual_measurements
          cat final/prosampler_elapsed_time.tsv

      - name: Upload complete results
        uses: actions/upload-artifact@v4
        with:
          name: prosampler-performance-results
          path: final
          retention-days: 1
          compression-level: 6
