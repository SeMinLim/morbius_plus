name: Temporary Morbius Plus SW DNA3 Long Benchmark

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-morbius-plus-sw-dna3-long.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: temporary-morbius-plus-sw-dna3-long
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish benchmark run status
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p temporary_results
          {
            echo "Run ID          : $GITHUB_RUN_ID"
            echo "Run attempt     : $GITHUB_RUN_ATTEMPT"
            echo "Source commit   : $GITHUB_SHA"
            echo "Widths          : 32 and 128"
            echo "Replicas        : 2 per width, lowest successful replica selected"
            echo "State           : PREPARING"
          } > temporary_results/morbius_plus_sw_dna3_long_status.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temporary_results/morbius_plus_sw_dna3_long_status.txt
          git commit -m 'Record temporary Morbius+ DNA3 long benchmark run' || true
          git push

  benchmark:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        motif_length: [32, 128]
        replica: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download validated DATASET_DNA_3
        uses: actions/download-artifact@v4
        with:
          name: morbius-plus-sw-dna3-input
          path: benchmark/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SeMinLim/morbius_plus
          run-id: 32686707102

      - name: Require AMD EPYC 9V74
        shell: bash
        run: |
          set -euo pipefail

          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"
          if [[ "$CPU_MODEL" != *"AMD EPYC 9V74"* ]]; then
            echo "Required CPU is AMD EPYC 9V74, but runner supplied: $CPU_MODEL"
            exit 78
          fi

      - name: Build Morbius Plus software
        shell: bash
        run: |
          set -euo pipefail

          make -C morbius_plus_vanila clean
          make -C morbius_plus_vanila

      - name: Measure one motif length on one CPU core
        shell: bash
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          MALLOC_ARENA_MAX: 2
        run: |
          set -euo pipefail

          MOTIF_LENGTH='${{ matrix.motif_length }}'
          REPLICA='${{ matrix.replica }}'
          INPUT_FILE="$PWD/benchmark/input/DATASET_DNA_3.fa"
          EXECUTABLE="$PWD/morbius_plus_vanila/morbius_plus_vanila"
          OUTPUT_DIR="$PWD/benchmark/output/W${MOTIF_LENGTH}_R${REPLICA}"
          OUTPUT_PREFIX="$OUTPUT_DIR/result"
          RESULT_DIR="$PWD/benchmark/result"
          LOG_FILE="$RESULT_DIR/run.log"
          TIME_FILE="$RESULT_DIR/time.tsv"
          CPU_ALLOWED="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          CPU_ID="$(printf '%s' "$CPU_ALLOWED" | cut -d',' -f1 | cut -d'-' -f1)"
          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"

          mkdir -p "$OUTPUT_DIR" "$RESULT_DIR"

          {
            echo "Run ID          : $GITHUB_RUN_ID"
            echo "Run attempt     : $GITHUB_RUN_ATTEMPT"
            echo "CPU model       : $CPU_MODEL"
            echo "CPU allowed     : $CPU_ALLOWED"
            echo "Pinned CPU      : $CPU_ID"
            echo "Motif length    : $MOTIF_LENGTH"
            echo "Replica         : $REPLICA"
            echo "Configuration   : 16 pipelines, 1 CPU thread, score threshold 0.90, seed 1"
          } > "$RESULT_DIR/environment.txt"

          sha256sum "$INPUT_FILE" > "$RESULT_DIR/input_checksum.sha256"

          sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true

          set +e
          /usr/bin/time \
            -f '%e\t%U\t%S\t%M\t%x' \
            -o "$TIME_FILE" \
            timeout --signal=TERM --kill-after=60s 10800s \
            taskset -c "$CPU_ID" \
            "$EXECUTABLE" \
              --input "$INPUT_FILE" \
              --output "$OUTPUT_PREFIX" \
              --alphabet dna \
              --motif-length "$MOTIF_LENGTH" \
              --pipelines 16 \
              --score-threshold 0.90 \
              --seed 1 \
              --threads 1 \
            > "$LOG_FILE" 2>&1
          COMMAND_RC=$?
          set -e

          WALL_TIME='NA'
          USER_TIME='NA'
          SYSTEM_TIME='NA'
          MAX_RSS='NA'
          if [ -s "$TIME_FILE" ]; then
            IFS=$'\t' read -r WALL_TIME USER_TIME SYSTEM_TIME MAX_RSS TIME_EXIT < "$TIME_FILE"
          fi

          INTERNAL_TIME="$(awk -F: '/Elapsed Time[[:space:]]*:/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' "$LOG_FILE")"
          STATUS='COMPLETED'
          if [ "$COMMAND_RC" -eq 124 ] || [ "$COMMAND_RC" -eq 137 ]; then
            STATUS='TIMEOUT_10800S'
          elif [ "$COMMAND_RC" -ne 0 ]; then
            STATUS="FAILED_RC_${COMMAND_RC}"
          elif [ -z "$INTERNAL_TIME" ]; then
            STATUS='FAILED_NO_INTERNAL_TIME'
          elif [ ! -s "${OUTPUT_PREFIX}.summary.txt" ]; then
            STATUS='FAILED_NO_RESULT'
          fi

          printf 'motif_length\treplica\tstatus\twall_seconds\tinternal_seconds\tuser_seconds\tsystem_seconds\tmax_rss_kb\texit_code\tcpu_model\n' \
            > "$RESULT_DIR/result.tsv"
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$MOTIF_LENGTH" \
            "$REPLICA" \
            "$STATUS" \
            "$WALL_TIME" \
            "$INTERNAL_TIME" \
            "$USER_TIME" \
            "$SYSTEM_TIME" \
            "$MAX_RSS" \
            "$COMMAND_RC" \
            "$CPU_MODEL" \
            >> "$RESULT_DIR/result.tsv"

          grep -E 'Seed Initialization Time|Elapsed Time|Best Pipeline|Best Normalized Score|Threshold Reached' \
            "$LOG_FILE" \
            > "$RESULT_DIR/summary.txt" || true

          cat "$RESULT_DIR/result.tsv"

          if [ "$STATUS" != 'COMPLETED' ]; then
            cat "$LOG_FILE"
            exit 1
          fi

      - name: Upload one measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morbius-plus-sw-dna3-long-W${{ matrix.motif_length }}-R${{ matrix.replica }}
          path: benchmark/result
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  collect:
    needs: benchmark
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download measurement artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: morbius-plus-sw-dna3-long-W*-R*
          path: collected
          merge-multiple: false

      - name: Select lowest successful replica per width
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p final
          python3 - <<'PY'
          import csv
          import shutil
          from pathlib import Path

          candidates = {}
          sources = {}

          for path in Path('collected').rglob('result.tsv'):
              with path.open(newline='') as input_file:
                  rows = list(csv.DictReader(input_file, delimiter='\t'))
              if len(rows) != 1:
                  continue

              row = rows[0]
              if row['status'] != 'COMPLETED':
                  continue
              if 'AMD EPYC 9V74' not in row['cpu_model']:
                  continue

              width = int(row['motif_length'])
              replica = int(row['replica'])
              previous = candidates.get(width)
              if previous is None or replica < int(previous['replica']):
                  candidates[width] = row
                  sources[width] = path.parent

          required = [32, 128]
          if sorted(candidates) != required:
              raise RuntimeError(
                  f'Expected successful widths {required}, found {sorted(candidates)}'
              )

          fields = [
              'motif_length',
              'replica',
              'status',
              'wall_seconds',
              'internal_seconds',
              'user_seconds',
              'system_seconds',
              'max_rss_kb',
              'exit_code',
              'cpu_model',
          ]

          with Path('final/morbius_plus_sw_dna3_long.tsv').open('w', newline='') as output_file:
              writer = csv.DictWriter(
                  output_file,
                  fieldnames=fields,
                  delimiter='\t',
                  lineterminator='\n',
              )
              writer.writeheader()
              for width in required:
                  writer.writerow(candidates[width])

          for width in required:
              destination = Path('final') / f'W{width}'
              shutil.copytree(sources[width], destination)
          PY

          cat final/morbius_plus_sw_dna3_long.tsv

      - name: Publish completed measurements
        shell: bash
        run: |
          set -euo pipefail

          git pull --rebase origin main

          DESTINATION='temporary_results/morbius_plus_sw_dna3_long_benchmark'
          rm -rf "$DESTINATION"
          mkdir -p "$DESTINATION"

          cp final/morbius_plus_sw_dna3_long.tsv "$DESTINATION/"
          for WIDTH in 32 128; do
            cp "final/W${WIDTH}/environment.txt" "$DESTINATION/environment_W${WIDTH}.txt"
            cp "final/W${WIDTH}/input_checksum.sha256" "$DESTINATION/input_checksum_W${WIDTH}.sha256"
            cp "final/W${WIDTH}/summary.txt" "$DESTINATION/summary_W${WIDTH}.txt"
          done

          {
            echo "Run ID          : $GITHUB_RUN_ID"
            echo "Run attempt     : $GITHUB_RUN_ATTEMPT"
            echo "Widths          : 32 and 128"
            echo "State           : COMPLETED"
          } > temporary_results/morbius_plus_sw_dna3_long_status.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temporary_results/morbius_plus_sw_dna3_long_status.txt "$DESTINATION"
          git commit -m 'Store temporary Morbius+ DNA3 long measurements'
          git push

      - name: Upload complete measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morbius-plus-sw-dna3-long-results
          path: final
          retention-days: 7
          compression-level: 6
