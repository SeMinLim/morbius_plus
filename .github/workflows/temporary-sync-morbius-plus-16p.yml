name: Temporary Morbius+ 16-pipeline synchronization

on:
  push:
    paths:
      - .github/workflows/temporary-sync-morbius-plus-16p.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    env:
      BLUEVITIS_COMMIT: ff93553d2258117dba07e84190b55809c8650f87
      PROTOCOL_B64: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize the finalized configuration
        run: |
          set -euo pipefail

          BLUEVITIS_RAW="https://raw.githubusercontent.com/SeMinLim/bluevitis/${BLUEVITIS_COMMIT}"
          KERNEL_DST="morbius_plus_accel/kernel_morbius_plus"
          HOST_DST="morbius_plus_accel/host_morbius_plus"
          mkdir -p "$KERNEL_DST" "$HOST_DST/test"

          kernel_files=(Axi4LiteControllerXrt.bsv Axi4MemoryMaster.bsv GibbsPipeline.bsv KernelMain.bsv KernelTop.bsv Makefile MorbiusTypes.bsv PwlLane.bsv README.md RandomGenerator.bsv TestGibbsPipeline.bsv kernel.xml makefile_us_alveo.mk)
          for filename in "${kernel_files[@]}"; do
            curl -fsSL "$BLUEVITIS_RAW/hw/kernel_morbius_plus/$filename" -o "$KERNEL_DST/$filename"
          done

          host_files=(AcceleratorMath.cpp AcceleratorModel.cpp AcceleratorProtocol.cpp Application.cpp HostOrchestrator.cpp Makefile MorbiusPlus.h README.md Result.cpp SeedInitialization.cpp Utility.cpp main.cpp main_model.cpp)
          for filename in "${host_files[@]}"; do
            curl -fsSL "$BLUEVITIS_RAW/sw/host_morbius_plus/$filename" -o "$HOST_DST/$filename"
          done

          test_files=(DNA_TEST.fasta PROTEIN_TEST.fasta run_accel_test.sh test_protocol.cpp)
          for filename in "${test_files[@]}"; do
            curl -fsSL "$BLUEVITIS_RAW/sw/host_morbius_plus/test/$filename" -o "$HOST_DST/test/$filename"
          done
          chmod +x "$HOST_DST/test/run_accel_test.sh"

          sed -i 's/--pipelines 4/--pipelines 16/g' README.md morbius_plus_accel/README.md
          printf '%s' "$PROTOCOL_B64" | base64 --decode > morbius_plus_accel/PROTOCOL.md

      - name: Verify synchronized parameters
        run: |
          set -euo pipefail
          grep -q '^typedef 16 NumPipeline;' morbius_plus_accel/kernel_morbius_plus/MorbiusTypes.bsv
          grep -q '^typedef 128 NumPE_Profiler;' morbius_plus_accel/kernel_morbius_plus/MorbiusTypes.bsv
          grep -q '^typedef 4 NumPE_LPM;' morbius_plus_accel/kernel_morbius_plus/MorbiusTypes.bsv
          grep -q '^#define DEFAULTNUMPIPELINE 16' morbius_plus_accel/host_morbius_plus/MorbiusPlus.h
          grep -q '^#define ACCELMAXPIPELINE 16' morbius_plus_accel/host_morbius_plus/MorbiusPlus.h
          grep -q '^#define ACCELSEGMENTSIZE 128' morbius_plus_accel/host_morbius_plus/MorbiusPlus.h
          grep -q '^#define ACCELPROTOCOLVERSION 2' morbius_plus_accel/host_morbius_plus/MorbiusPlus.h
          grep -q 'ACCELRESULTBYTES' morbius_plus_accel/host_morbius_plus/MorbiusPlus.h
          grep -q 'four 512-bit result beats' morbius_plus_accel/PROTOCOL.md
          if grep -R --line-number --fixed-strings -- '--pipelines 4' README.md morbius_plus_accel; then
            echo 'A stale four-pipeline invocation remains.'
            exit 1
          fi

      - name: Commit directly to main
        run: |
          rm .github/workflows/temporary-sync-morbius-plus-16p.yml
          rm -f .github/workflows/temporary-update-morbius-pe.yml
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add README.md morbius_plus_accel .github/workflows
          git commit -m "Scale Morbius+ accelerator to 16 pipelines"
          git push origin HEAD:main
