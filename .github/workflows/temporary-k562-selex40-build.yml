name: Temporary K562 SELEX 40 Dataset Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-k562-selex40-build.yml'

permissions:
  contents: read

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MEME Suite 5.3.0
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: chipseq
          create-args: >-
            -c conda-forge
            -c bioconda
            python=3.9
            meme=5.3.0
          cache-environment: true
          init-shell: bash

      - name: Build K562 SELEX 40 datasets
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail

          mkdir -p work/peaks work/bed work/udc
          mkdir -p output/K562_SELEX_40/Primary
          mkdir -p output/K562_SELEX_40/Control
          mkdir -p output/K562_SELEX_40/Reference_Motifs

          cat > work/table_s1.tsv <<'EOF'
          dataset_id	chip_target	encode_narrowpeak_file	reference_motif_name
          TF_01	ATF3	wgEncodeAwgTfbsSydhK562Atf3UniPk.narrowPeak	ATF4 DBD
          TF_02	ATF3	wgEncodeAwgTfbsHaibK562Atf3V0416101UniPk.narrowPeak	ATF4 DBD
          TF_03	ATF1	wgEncodeAwgTfbsSydhK562Atf106325UniPk.narrowPeak	ATF7 DBD
          TF_04	BHLHE40	wgEncodeAwgTfbsSydhK562Bhlhe40nb100IggrabUniPk.narrowPeak	BHLHE41 full
          TF_05	CEBPB	wgEncodeAwgTfbsSydhK562CebpbIggrabUniPk.narrowPeak	CEBPB full
          TF_06	CTCF	wgEncodeAwgTfbsBroadK562CtcfUniPk.narrowPeak	CTCF full
          TF_07	CTCF	wgEncodeAwgTfbsUwK562CtcfUniPk.narrowPeak	CTCF full
          TF_08	CTCF	wgEncodeAwgTfbsUtaK562CtcfUniPk.narrowPeak	CTCF full
          TF_09	E2F4	wgEncodeAwgTfbsSydhK562E2f4UcdUniPk.narrowPeak	E2F7 DBD
          TF_10	E2F6	wgEncodeAwgTfbsSydhK562E2f6UcdUniPk.narrowPeak	E2F7 DBD
          TF_11	E2F6	wgEncodeAwgTfbsHaibK562E2f6V0416102UniPk.narrowPeak	E2F7 DBD
          TF_12	EGR1	wgEncodeAwgTfbsHaibK562Egr1V0416101UniPk.narrowPeak	EGR1 DBD
          TF_13	ELF1	wgEncodeAwgTfbsHaibK562Elf1sc631V0416102UniPk.narrowPeak	ELF1 DBD
          TF_14	ELK1	wgEncodeAwgTfbsSydhK562Elk112771IggrabUniPk.narrowPeak	ELK1 DBD 2
          TF_15	ETS1	wgEncodeAwgTfbsHaibK562Ets1V0416101UniPk.narrowPeak	ETS1 DBD 1
          TF_16	GATA2	wgEncodeAwgTfbsHaibK562Gata2sc267Pcr1xUniPk.narrowPeak	GATA3 DBD
          TF_17	GATA1	wgEncodeAwgTfbsSydhK562Gata1UcdUniPk.narrowPeak	GATA4 DBD
          TF_18	GATA2	wgEncodeAwgTfbsSydhK562Gata2UcdUniPk.narrowPeak	GATA4 DBD
          TF_19	IRF1	wgEncodeAwgTfbsSydhK562Irf1Ifna6hUniPk.narrowPeak	IRF8 full
          TF_20	IRF1	wgEncodeAwgTfbsSydhK562Irf1Ifng30UniPk.narrowPeak	IRF8 full
          TF_21	IRF1	wgEncodeAwgTfbsSydhK562Irf1Ifna30UniPk.narrowPeak	IRF9 full
          TF_22	MAFF	wgEncodeAwgTfbsSydhK562MaffIggrabUniPk.narrowPeak	MAFF DBD
          TF_23	MAX	wgEncodeAwgTfbsSydhK562MaxIggrabUniPk.narrowPeak	MAX DBD 2
          TF_24	MAX	wgEncodeAwgTfbsHaibK562MaxV0416102UniPk.narrowPeak	MAX DBD 2
          TF_25	MEF2A	wgEncodeAwgTfbsHaibK562Mef2aV0416101UniPk.narrowPeak	MEF2A DBD
          TF_26	NFE2	wgEncodeAwgTfbsSydhK562Nfe2UniPk.narrowPeak	NFE2 DBD
          TF_27	NR2F2	wgEncodeAwgTfbsHaibK562Nr2f2sc271940V0422111UniPk.narrowPeak	NR2F1 DBD 3
          TF_28	NRF1	wgEncodeAwgTfbsSydhK562Nrf1IggrabUniPk.narrowPeak	NRF1 full
          TF_29	RFX5	wgEncodeAwgTfbsSydhK562Rfx5IggrabUniPk.narrowPeak	RFX5 DBD 2
          TF_30	SP1	wgEncodeAwgTfbsHaibK562Sp1Pcr1xUniPk.narrowPeak	SP1 DBD
          TF_31	SP2	wgEncodeAwgTfbsHaibK562Sp2sc643V0416102UniPk.narrowPeak	SP4 full
          TF_32	SRF	wgEncodeAwgTfbsHaibK562SrfV0416101UniPk.narrowPeak	SRF full
          TF_33	TEAD4	wgEncodeAwgTfbsHaibK562Tead4sc101184V0422111UniPk.narrowPeak	TEAD4 DBD
          TF_34	USF2	wgEncodeAwgTfbsSydhK562Usf2IggrabUniPk.narrowPeak	USF1 DBD
          TF_35	USF1	wgEncodeAwgTfbsHaibK562Usf1V0416101UniPk.narrowPeak	USF1 DBD
          TF_36	YY1	wgEncodeAwgTfbsHaibK562Yy1V0416101UniPk.narrowPeak	YY1 full
          TF_37	YY1	wgEncodeAwgTfbsSydhK562Yy1UcdUniPk.narrowPeak	YY1 full
          TF_38	YY1	wgEncodeAwgTfbsHaibK562Yy1V0416102UniPk.narrowPeak	YY1 full
          TF_39	ZBTB7A	wgEncodeAwgTfbsHaibK562Zbtb7asc34508V0416101UniPk.narrowPeak	ZBTB7A DBD
          TF_40	ZNF143	wgEncodeAwgTfbsSydhK562Znf143IggrabUniPk.narrowPeak	ZNF143 DBD
          EOF

          PEAK_BASE='https://hgdownload.soe.ucsc.edu/goldenPath/hg19/encodeDCC/wgEncodeAwgTfbsUniform'
          while IFS=$'\t' read -r dataset_id chip_target peak_file reference_motif; do
            if [ "$dataset_id" = 'dataset_id' ]; then
              continue
            fi
            curl -fL --retry 5 --retry-delay 2 \
              "$PEAK_BASE/${peak_file}.gz" \
              -o "work/peaks/${peak_file}.gz"
          done < work/table_s1.tsv

          curl -fL --retry 5 --retry-delay 2 \
            'https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/hg19.chrom.sizes' \
            -o work/hg19.chrom.sizes

          curl -fL --retry 5 --retry-delay 2 \
            'https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/hg19.2bit' \
            -o work/hg19.2bit

          curl -fL --retry 5 --retry-delay 2 \
            'https://hgdownload.soe.ucsc.edu/admin/exe/linux.x86_64/twoBitToFa' \
            -o work/twoBitToFa
          chmod +x work/twoBitToFa

          cat > work/prepare_intervals.py <<'PY'
          import csv
          import gzip
          from pathlib import Path

          work = Path('work')
          chrom_sizes = {}
          with (work / 'hg19.chrom.sizes').open() as input_file:
              for line in input_file:
                  chrom, size = line.rstrip('\n').split('\t')
                  chrom_sizes[chrom] = int(size)

          rows = []
          with (work / 'table_s1.tsv').open() as input_file:
              rows = list(csv.DictReader(input_file, delimiter='\t'))

          all_bed = (work / 'all.bed').open('w')
          summary = (work / 'interval_summary.tsv').open('w', newline='')
          summary_writer = csv.writer(summary, delimiter='\t', lineterminator='\n')
          summary_writer.writerow(['dataset_id', 'interval_num', 'discarded_interval_num'])

          for row in rows:
              dataset_id = row['dataset_id']
              peak_path = work / 'peaks' / f"{row['encode_narrowpeak_file']}.gz"
              bed_path = work / 'bed' / f'{dataset_id}.bed'
              interval_num = 0
              discarded_num = 0

              with gzip.open(peak_path, 'rt') as peak_file, bed_path.open('w') as bed_file:
                  for line in peak_file:
                      if not line.strip() or line.startswith('#'):
                          continue
                      fields = line.rstrip('\n').split('\t')
                      if len(fields) < 10:
                          raise RuntimeError(f'Invalid narrowPeak record in {peak_path}: {line}')

                      chrom = fields[0]
                      chrom_start = int(fields[1])
                      peak_offset = int(fields[9])
                      if chrom not in chrom_sizes or peak_offset < 0:
                          discarded_num += 1
                          continue

                      summit = chrom_start + peak_offset
                      start = summit - 50
                      end = summit + 50
                      if start < 0 or end > chrom_sizes[chrom]:
                          discarded_num += 1
                          continue

                      interval_num += 1
                      record_id = f'{dataset_id}_{interval_num:06d}'
                      record = f'{chrom}\t{start}\t{end}\t{record_id}\n'
                      bed_file.write(record)
                      all_bed.write(record)

              if interval_num == 0:
                  raise RuntimeError(f'No valid intervals for {dataset_id}')
              summary_writer.writerow([dataset_id, interval_num, discarded_num])

          all_bed.close()
          summary.close()
          PY
          python work/prepare_intervals.py

          work/twoBitToFa \
            work/hg19.2bit \
            work/all.fa \
            -bed=work/all.bed \
            -noMask

          cat > work/split_primary.py <<'PY'
          from pathlib import Path

          source = Path('work/all.fa')
          output_dir = Path('output/K562_SELEX_40/Primary')
          handles = {}
          counts = {}

          header = None
          sequence_parts = []

          def emit(current_header, parts):
              if current_header is None:
                  return
              sequence = ''.join(parts).upper()
              dataset_id = current_header.split('_', 2)[0] + '_' + current_header.split('_', 2)[1]
              if len(sequence) != 100:
                  raise RuntimeError(f'{current_header} has length {len(sequence)} instead of 100')
              if not set(sequence).issubset(set('ACGTN')):
                  raise RuntimeError(f'{current_header} contains unsupported symbols')
              if dataset_id not in handles:
                  handles[dataset_id] = (output_dir / f'{dataset_id}.fasta').open('w')
                  counts[dataset_id] = 0
              handles[dataset_id].write(f'>{current_header}\n{sequence}\n')
              counts[dataset_id] += 1

          with source.open() as input_file:
              for raw_line in input_file:
                  line = raw_line.strip()
                  if not line:
                      continue
                  if line.startswith('>'):
                      emit(header, sequence_parts)
                      header = line[1:].split()[0]
                      sequence_parts = []
                  else:
                      sequence_parts.append(line)
              emit(header, sequence_parts)

          for handle in handles.values():
              handle.close()

          if len(counts) != 40:
              raise RuntimeError(f'Expected 40 primary datasets, found {len(counts)}')

          with Path('work/primary_counts.tsv').open('w') as output:
              output.write('dataset_id\tsequence_num\n')
              for dataset_id in sorted(counts):
                  output.write(f'{dataset_id}\t{counts[dataset_id]}\n')
          PY
          python work/split_primary.py

          SHUFFLER="$(command -v fasta-shuffle-letters || true)"
          if [ -z "$SHUFFLER" ]; then
            SHUFFLER="$(find "$CONDA_PREFIX" -type f -name fasta-shuffle-letters | head -n 1)"
          fi
          if [ -z "$SHUFFLER" ] || [ ! -x "$SHUFFLER" ]; then
            echo 'fasta-shuffle-letters was not found.' >&2
            exit 1
          fi

          for dataset_id in $(seq -w 1 40); do
            "$SHUFFLER" \
              -dna \
              -kmer 3 \
              -seed 1 \
              -line 100 \
              -tag _control \
              "output/K562_SELEX_40/Primary/TF_${dataset_id}.fasta" \
              "output/K562_SELEX_40/Control/TF_${dataset_id}_control.fasta"
          done

          MOTIF_ARCHIVE=work/motif_databases.12.19.tgz
          if ! curl -fL --retry 5 --retry-delay 2 \
            'https://meme-suite.org/meme-software/Databases/motifs/motif_databases.12.19.tgz' \
            -o "$MOTIF_ARCHIVE"; then
            curl -fL --retry 5 --retry-delay 2 \
              'http://meme-suite.org/meme-software/Databases/motifs/motif_databases.12.19.tgz' \
              -o "$MOTIF_ARCHIVE"
          fi

          JOLMA_PATH="$(tar -tzf "$MOTIF_ARCHIVE" | grep -E '(^|/)EUKARYOTE/Jolma2013\.meme$' | head -n 1)"
          if [ -z "$JOLMA_PATH" ]; then
            echo 'Jolma2013.meme was not found in the motif database archive.' >&2
            exit 1
          fi
          tar -xOzf "$MOTIF_ARCHIVE" "$JOLMA_PATH" \
            > output/K562_SELEX_40/Reference_Motifs/Jolma2013.meme

          cat > work/validate_and_metadata.py <<'PY'
          import csv
          import hashlib
          from collections import Counter
          from pathlib import Path

          root = Path('output/K562_SELEX_40')
          work = Path('work')

          def read_fasta(path):
              records = []
              header = None
              sequence_parts = []
              with path.open() as input_file:
                  for raw_line in input_file:
                      line = raw_line.strip()
                      if not line:
                          continue
                      if line.startswith('>'):
                          if header is not None:
                              records.append((header, ''.join(sequence_parts)))
                          header = line[1:].split()[0]
                          sequence_parts = []
                      else:
                          sequence_parts.append(line.upper())
                  if header is not None:
                      records.append((header, ''.join(sequence_parts)))
              return records

          def sha256(path):
              digest = hashlib.sha256()
              with path.open('rb') as input_file:
                  for chunk in iter(lambda: input_file.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          motif_file = root / 'Reference_Motifs' / 'Jolma2013.meme'
          motif_entries = []
          with motif_file.open() as input_file:
              for line in input_file:
                  if line.startswith('MOTIF '):
                      parts = line.rstrip('\n').split(maxsplit=2)
                      motif_id = parts[1]
                      motif_name = parts[2] if len(parts) > 2 else parts[1]
                      motif_entries.append((motif_id, motif_name))

          def normalize(value):
              return ' '.join(value.replace('_', ' ').replace('-', ' ').split()).casefold()

          motif_lookup = {}
          for motif_id, motif_name in motif_entries:
              motif_lookup.setdefault(normalize(motif_id), []).append(motif_id)
              motif_lookup.setdefault(normalize(motif_name), []).append(motif_id)

          table_rows = []
          with (work / 'table_s1.tsv').open() as input_file:
              table_rows = list(csv.DictReader(input_file, delimiter='\t'))

          interval_summary = {}
          with (work / 'interval_summary.tsv').open() as input_file:
              for row in csv.DictReader(input_file, delimiter='\t'):
                  interval_summary[row['dataset_id']] = row

          metadata_fields = [
              'dataset_id',
              'chip_target',
              'primary_file',
              'control_file',
              'encode_narrowpeak_file',
              'encode_narrowpeak_url',
              'reference_motif_name',
              'reference_motif_id',
              'sequence_num',
              'sequence_length',
              'discarded_peak_num',
              'control_kmer',
              'control_shuffle_seed',
              'genome',
              'peak_center_definition',
              'primary_sha256',
              'control_sha256',
          ]

          total_sequences = 0
          with (root / 'metadata.tsv').open('w', newline='') as output_file:
              writer = csv.DictWriter(
                  output_file,
                  fieldnames=metadata_fields,
                  delimiter='\t',
                  lineterminator='\n',
              )
              writer.writeheader()

              for row in table_rows:
                  dataset_id = row['dataset_id']
                  primary_path = root / 'Primary' / f'{dataset_id}.fasta'
                  control_path = root / 'Control' / f'{dataset_id}_control.fasta'
                  primary_records = read_fasta(primary_path)
                  control_records = read_fasta(control_path)

                  if len(primary_records) != len(control_records):
                      raise RuntimeError(f'Record-count mismatch for {dataset_id}')
                  if len(primary_records) != int(interval_summary[dataset_id]['interval_num']):
                      raise RuntimeError(f'Interval-count mismatch for {dataset_id}')
                  if not (1233 <= len(primary_records) <= 56058):
                      raise RuntimeError(
                          f'{dataset_id} sequence count {len(primary_records)} is outside the published range'
                      )

                  for record_idx, ((primary_id, primary_sequence), (control_id, control_sequence)) in enumerate(
                      zip(primary_records, control_records),
                      start=1,
                  ):
                      if len(primary_sequence) != 100 or len(control_sequence) != 100:
                          raise RuntimeError(f'Length mismatch for {dataset_id}, record {record_idx}')
                      if Counter(
                          primary_sequence[position:position + 3]
                          for position in range(len(primary_sequence) - 2)
                      ) != Counter(
                          control_sequence[position:position + 3]
                          for position in range(len(control_sequence) - 2)
                      ):
                          raise RuntimeError(
                              f'3-mer preservation failed for {dataset_id}, record {record_idx}'
                          )

                  reference_key = normalize(row['reference_motif_name'])
                  matches = sorted(set(motif_lookup.get(reference_key, [])))
                  if len(matches) != 1:
                      raise RuntimeError(
                          f"Could not uniquely resolve motif '{row['reference_motif_name']}': {matches}"
                      )

                  total_sequences += len(primary_records)
                  peak_url = (
                      'https://hgdownload.soe.ucsc.edu/goldenPath/hg19/'
                      'encodeDCC/wgEncodeAwgTfbsUniform/'
                      f"{row['encode_narrowpeak_file']}.gz"
                  )
                  writer.writerow({
                      'dataset_id': dataset_id,
                      'chip_target': row['chip_target'],
                      'primary_file': f'Primary/{dataset_id}.fasta',
                      'control_file': f'Control/{dataset_id}_control.fasta',
                      'encode_narrowpeak_file': row['encode_narrowpeak_file'],
                      'encode_narrowpeak_url': peak_url,
                      'reference_motif_name': row['reference_motif_name'],
                      'reference_motif_id': matches[0],
                      'sequence_num': len(primary_records),
                      'sequence_length': 100,
                      'discarded_peak_num': interval_summary[dataset_id]['discarded_interval_num'],
                      'control_kmer': 3,
                      'control_shuffle_seed': 1,
                      'genome': 'hg19',
                      'peak_center_definition': 'chromStart + narrowPeak column 10; [summit-50,summit+50)',
                      'primary_sha256': sha256(primary_path),
                      'control_sha256': sha256(control_path),
                  })

          print(f'Validated 40 primary datasets and 40 controls ({total_sequences} sequences each side).')
          print(f'Jolma2013 motif entries: {len(motif_entries)}')
          PY
          python work/validate_and_metadata.py

          find output/K562_SELEX_40 -type f -maxdepth 3 -printf '%P\t%s bytes\n' | sort

      - name: Upload generated datasets
        uses: actions/upload-artifact@v4
        with:
          name: K562-SELEX-40
          path: output/K562_SELEX_40
          retention-days: 1
          compression-level: 6
