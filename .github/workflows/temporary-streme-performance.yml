name: Temporary STREME Seed-0 Remaining Measurements

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-streme-performance.yml'

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - dataset: 3
            motif_length: 4
            swap_gb: 0
            external_timeout: 7200
          - dataset: 3
            motif_length: 8
            swap_gb: 8
            external_timeout: 14400
          - dataset: 1
            motif_length: 16
            swap_gb: 48
            external_timeout: 21120
          - dataset: 2
            motif_length: 16
            swap_gb: 48
            external_timeout: 21120
          - dataset: 3
            motif_length: 16
            swap_gb: 48
            external_timeout: 21120

    steps:
      - name: Install STREME 5.5.9
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: streme-benchmark
          create-args: >-
            -c conda-forge
            -c bioconda
            python=3.9
            meme=5.5.9
          cache-environment: true
          init-shell: bash

      - name: Download exact DNA datasets
        uses: actions/download-artifact@v4
        with:
          name: streme-seed0-dna-datasets
          path: benchmark/package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SeMinLim/morbius_plus
          run-id: 31948091866

      - name: Configure memory policy
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p benchmark/result
          SWAP_GB='${{ matrix.swap_gb }}'

          if [ "$SWAP_GB" -gt 0 ]; then
            sudo fallocate -l "${SWAP_GB}G" /swapfile-streme
            sudo chmod 600 /swapfile-streme
            sudo mkswap /swapfile-streme
            sudo swapon -p 10 /swapfile-streme
          fi

          sudo sysctl -w vm.swappiness=1 || true
          sudo sysctl -w vm.page-cluster=0 || true

          {
            free -h
            df -h /
            swapon --show || true
          } > benchmark/result/memory_setup.txt

      - name: Run one single-core STREME measurement
        shell: micromamba-shell {0}
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          VECLIB_MAXIMUM_THREADS: '1'
        run: |
          set -u

          mkdir -p benchmark/result benchmark/output

          DATASET_ID='${{ matrix.dataset }}'
          MOTIF_LENGTH='${{ matrix.motif_length }}'
          EXTERNAL_TIMEOUT='${{ matrix.external_timeout }}'
          INPUT_FILE="benchmark/package/DATASET_DNA_${DATASET_ID}.fa"
          OUTPUT_DIR="benchmark/output/DNA${DATASET_ID}_W${MOTIF_LENGTH}"
          LOG_FILE="benchmark/result/run.log"
          TIME_FILE="benchmark/result/time.txt"
          RESULT_FILE="benchmark/result/result.tsv"
          ENV_FILE="benchmark/result/environment.txt"

          CPU_ALLOWED="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          CPU_ID="$(printf '%s' "$CPU_ALLOWED" | cut -d',' -f1 | cut -d'-' -f1)"
          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"
          STREME_PATH="$(command -v streme)"
          STREME_VERSION="$($STREME_PATH --version 2>&1 | head -n 1)"

          {
            echo '=== uname ==='
            uname -a
            echo
            echo '=== lscpu ==='
            lscpu
            echo
            echo '=== memory ==='
            free -h
            echo
            echo "STREME path           : $STREME_PATH"
            echo "STREME version        : $STREME_VERSION"
            echo "Benchmark CPU ID      : $CPU_ID"
            echo "Benchmark CPU allowed : $CPU_ALLOWED"
            echo "Dataset               : DATASET_DNA_${DATASET_ID}.fa"
            echo "Motif length          : $MOTIF_LENGTH"
            echo 'Motif number          : 1'
            echo 'DNA strand mode       : STREME standard DNA search'
            echo 'Background order      : 2'
            echo 'Random seed           : 0'
            echo "External timeout      : ${EXTERNAL_TIMEOUT} seconds"
            echo 'Command parameters    : --dna --w <length> --nmotifs 1 --order 2 --seed 0'
          } > "$ENV_FILE"

          sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true

          set +e
          /usr/bin/time \
            -f 'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M\nexit_code=%x' \
            -o "$TIME_FILE" \
            timeout --signal=TERM --kill-after=60s "$EXTERNAL_TIMEOUT" \
            taskset -c "$CPU_ID" \
            "$STREME_PATH" \
              --p "$INPUT_FILE" \
              --oc "$OUTPUT_DIR" \
              --dna \
              --w "$MOTIF_LENGTH" \
              --nmotifs 1 \
              --order 2 \
              --seed 0 \
            > "$LOG_FILE" 2>&1
          COMMAND_RC=$?
          set -e

          ELAPSED="$(awk -F= '$1 == "elapsed_seconds" {print $2}' "$TIME_FILE" | tail -n 1)"
          USER_TIME="$(awk -F= '$1 == "user_seconds" {print $2}' "$TIME_FILE" | tail -n 1)"
          SYSTEM_TIME="$(awk -F= '$1 == "system_seconds" {print $2}' "$TIME_FILE" | tail -n 1)"
          MAX_RSS="$(awk -F= '$1 == "max_rss_kb" {print $2}' "$TIME_FILE" | tail -n 1)"

          [ -n "$ELAPSED" ] || ELAPSED='NA'
          [ -n "$USER_TIME" ] || USER_TIME='NA'
          [ -n "$SYSTEM_TIME" ] || SYSTEM_TIME='NA'
          [ -n "$MAX_RSS" ] || MAX_RSS='NA'

          STATUS='COMPLETED'
          if [ "$COMMAND_RC" -eq 124 ]; then
            STATUS="TIMEOUT_${EXTERNAL_TIMEOUT}S"
          elif [ "$COMMAND_RC" -eq 137 ] || [ "$COMMAND_RC" -eq 143 ]; then
            STATUS='KILLED_OR_OOM'
          elif [ "$COMMAND_RC" -ne 0 ]; then
            STATUS="FAILED_RC_${COMMAND_RC}"
          elif [ ! -s "$OUTPUT_DIR/streme.txt" ]; then
            STATUS='FAILED_NO_STREME_OUTPUT'
          fi

          printf 'dataset\tmotif_length\tstatus\telapsed_seconds\tuser_seconds\tsystem_seconds\tmax_rss_kb\texit_code\tcpu_model\tstreme_version\n' \
            > "$RESULT_FILE"
          printf 'DATASET_DNA_%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$DATASET_ID" \
            "$MOTIF_LENGTH" \
            "$STATUS" \
            "$ELAPSED" \
            "$USER_TIME" \
            "$SYSTEM_TIME" \
            "$MAX_RSS" \
            "$COMMAND_RC" \
            "$CPU_MODEL" \
            "$STREME_VERSION" \
            >> "$RESULT_FILE"

          cat "$RESULT_FILE"
          exit 0

      - name: Upload one STREME measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streme-seed0-refined-DNA${{ matrix.dataset }}-W${{ matrix.motif_length }}
          path: benchmark/result
          retention-days: 1
          compression-level: 6

  collect:
    needs: benchmark
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download measurement artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: streme-seed0-refined-DNA*-W*
          path: collected
          merge-multiple: false

      - name: Aggregate remaining results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final

          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = []
          for path in Path('collected').rglob('result.tsv'):
              with path.open(newline='') as input_file:
                  rows.extend(csv.DictReader(input_file, delimiter='\t'))

          rows.sort(key=lambda row: (
              int(row['dataset'].rsplit('_', 1)[1]),
              int(row['motif_length']),
          ))

          output = Path('final/streme_seed0_remaining.tsv')
          fields = [
              'dataset',
              'motif_length',
              'status',
              'elapsed_seconds',
              'user_seconds',
              'system_seconds',
              'max_rss_kb',
              'exit_code',
              'cpu_model',
              'streme_version',
          ]
          with output.open('w', newline='') as output_file:
              writer = csv.DictWriter(
                  output_file,
                  fieldnames=fields,
                  delimiter='\t',
                  lineterminator='\n',
              )
              writer.writeheader()
              writer.writerows(rows)

          if len(rows) != 5:
              raise RuntimeError(f'Expected 5 measurements, found {len(rows)}')
          PY

          cp -a collected final/individual_measurements
          cat final/streme_seed0_remaining.tsv

      - name: Upload complete remaining results
        uses: actions/upload-artifact@v4
        with:
          name: streme-seed0-remaining-results
          path: final
          retention-days: 1
          compression-level: 6
