name: Temporary HOMER DNA1 Parallel Benchmark

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-homer-dna1-parallel.yml'

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        motif_length: [4, 8, 16]

    steps:
      - name: Install HOMER 5.1 and MEME Suite 5.5.9
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: homer-benchmark
          create-args: >-
            -c conda-forge
            -c bioconda
            homer=5.1
            meme=5.5.9
          cache-environment: true
          init-shell: bash

      - name: Download exact synthetic DNA dataset
        uses: actions/download-artifact@v4
        with:
          name: prosampler-benchmark-package
          path: benchmark/package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SeMinLim/morbius_plus
          run-id: 31936768291

      - name: Generate matched control dataset
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail

          mkdir -p benchmark/control benchmark/result benchmark/output

          INPUT_FILE='benchmark/package/DATASET_DNA_1.fa'
          CONTROL_FILE='benchmark/control/DATASET_DNA_1_control.fa'

          fasta-shuffle-letters \
            -dna \
            -kmer 3 \
            -seed 0 \
            -line 1000 \
            -tag _control \
            "$INPUT_FILE" \
            "$CONTROL_FILE"

          INPUT_NUM="$(grep -c '^>' "$INPUT_FILE")"
          CONTROL_NUM="$(grep -c '^>' "$CONTROL_FILE")"
          if [ "$INPUT_NUM" -ne 32768 ] || [ "$CONTROL_NUM" -ne 32768 ]; then
            echo "Unexpected sequence counts: $INPUT_NUM, $CONTROL_NUM" >&2
            exit 1
          fi

          sha256sum "$INPUT_FILE" "$CONTROL_FILE" \
            > benchmark/result/input_and_control_checksums.sha256

      - name: Configure swap
        shell: bash
        run: |
          set -euo pipefail

          FREE_BYTES="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
          RESERVE_BYTES=$((12 * 1024 * 1024 * 1024))
          MAX_SWAP_BYTES=$((40 * 1024 * 1024 * 1024))
          FILE_SWAP_BYTES=$((FREE_BYTES - RESERVE_BYTES))

          if [ "$FILE_SWAP_BYTES" -gt "$MAX_SWAP_BYTES" ]; then
            FILE_SWAP_BYTES="$MAX_SWAP_BYTES"
          fi

          if [ "$FILE_SWAP_BYTES" -ge $((8 * 1024 * 1024 * 1024)) ]; then
            sudo fallocate -l "$FILE_SWAP_BYTES" /swapfile-homer
            sudo chmod 600 /swapfile-homer
            sudo mkswap /swapfile-homer
            sudo swapon -p 10 /swapfile-homer
            sudo sysctl -w vm.swappiness=100 || true
            sudo sysctl -w vm.page-cluster=0 || true
          fi

          {
            free -h
            df -h /
            swapon --show || true
          } > benchmark/result/swap_setup.txt

      - name: Measure one HOMER motif length on one CPU core
        shell: micromamba-shell {0}
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          MALLOC_ARENA_MAX: 2
        run: |
          set -u

          INPUT_FILE='benchmark/package/DATASET_DNA_1.fa'
          CONTROL_FILE='benchmark/control/DATASET_DNA_1_control.fa'
          MOTIF_LENGTH='${{ matrix.motif_length }}'
          OUTPUT_DIR="benchmark/output/W${MOTIF_LENGTH}"
          TIME_FILE='benchmark/result/time.tsv'
          LOG_FILE='benchmark/result/run.log'
          CPU_ALLOWED="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          CPU_ID="$(printf '%s' "$CPU_ALLOWED" | cut -d',' -f1 | cut -d'-' -f1)"
          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"
          HOMER_VERSION="$(micromamba list homer | awk '$1 == "homer" {print $2; exit}')"

          {
            echo "CPU model       : $CPU_MODEL"
            echo "CPU allowed     : $CPU_ALLOWED"
            echo "Pinned CPU      : $CPU_ID"
            echo "HOMER version   : $HOMER_VERSION"
            echo "Input           : DATASET_DNA_1.fa"
            echo "Motif length    : $MOTIF_LENGTH"
            echo "Parameters      : -basic -len $MOTIF_LENGTH -S 1 -noknown -noweight -norevopp -p 1"
            echo "Control         : 3-mer-preserving shuffle, seed 0"
            echo "Time limit      : 5400 seconds"
          } > benchmark/result/environment.txt

          sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true

          set +e
          /usr/bin/time \
            -f '%e\t%U\t%S\t%M\t%x' \
            -o "$TIME_FILE" \
            timeout --signal=TERM --kill-after=60s 5400s \
            taskset -c "$CPU_ID" \
            findMotifs.pl \
              "$INPUT_FILE" \
              fasta \
              "$OUTPUT_DIR" \
              -fastaBg "$CONTROL_FILE" \
              -basic \
              -len "$MOTIF_LENGTH" \
              -S 1 \
              -noknown \
              -noweight \
              -norevopp \
              -p 1 \
            > "$LOG_FILE" 2>&1
          COMMAND_RC=$?
          set -e

          ELAPSED='NA'
          USER_TIME='NA'
          SYSTEM_TIME='NA'
          MAX_RSS='NA'
          if [ -s "$TIME_FILE" ]; then
            IFS=$'\t' read -r ELAPSED USER_TIME SYSTEM_TIME MAX_RSS TIME_EXIT < "$TIME_FILE"
          fi

          STATUS='COMPLETED'
          if [ "$COMMAND_RC" -eq 124 ] || [ "$COMMAND_RC" -eq 137 ]; then
            STATUS='TIMEOUT_5400S'
          elif [ "$COMMAND_RC" -ne 0 ]; then
            STATUS="FAILED_RC_${COMMAND_RC}"
          fi

          MOTIF_NUM=0
          if [ -d "$OUTPUT_DIR" ]; then
            MOTIF_NUM="$(find "$OUTPUT_DIR" -type f \( -name '*.motif' -o -name '*.motifs' \) -print0 2>/dev/null \
              | xargs -0 -r grep -h '^>' 2>/dev/null \
              | wc -l \
              | tr -d ' ')"
          fi

          if [ "$STATUS" = 'COMPLETED' ] && [ "$MOTIF_NUM" -lt 1 ]; then
            STATUS='FAILED_NO_MOTIF'
          fi

          printf 'motif_length\tstatus\telapsed_seconds\tuser_seconds\tsystem_seconds\tmax_rss_kb\texit_code\tmotif_num\tcpu_model\thomer_version\n' \
            > benchmark/result/result.tsv
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$MOTIF_LENGTH" \
            "$STATUS" \
            "$ELAPSED" \
            "$USER_TIME" \
            "$SYSTEM_TIME" \
            "$MAX_RSS" \
            "$COMMAND_RC" \
            "$MOTIF_NUM" \
            "$CPU_MODEL" \
            "$HOMER_VERSION" \
            >> benchmark/result/result.tsv

          if [ -s "$OUTPUT_DIR/motifFindingParameters.txt" ]; then
            cp "$OUTPUT_DIR/motifFindingParameters.txt" benchmark/result/motifFindingParameters.txt
          fi

          cat benchmark/result/result.tsv

      - name: Upload one HOMER measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homer-dna1-W${{ matrix.motif_length }}
          path: benchmark/result
          retention-days: 1
          compression-level: 6

  collect:
    needs: benchmark
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Download measurements
        uses: actions/download-artifact@v4
        with:
          pattern: homer-dna1-W*
          path: collected
          merge-multiple: false

      - name: Aggregate measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final

          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = []
          for path in Path('collected').rglob('result.tsv'):
              with path.open(newline='') as input_file:
                  rows.extend(csv.DictReader(input_file, delimiter='\t'))

          rows.sort(key=lambda row: int(row['motif_length']))
          fields = [
              'motif_length',
              'status',
              'elapsed_seconds',
              'user_seconds',
              'system_seconds',
              'max_rss_kb',
              'exit_code',
              'motif_num',
              'cpu_model',
              'homer_version',
          ]

          with Path('final/homer_dna1.tsv').open('w', newline='') as output_file:
              writer = csv.DictWriter(
                  output_file,
                  fieldnames=fields,
                  delimiter='\t',
                  lineterminator='\n',
              )
              writer.writeheader()
              writer.writerows(rows)

          if len(rows) != 3:
              raise RuntimeError(f'Expected 3 measurements, found {len(rows)}')
          PY

          cp -a collected final/individual_measurements
          cat final/homer_dna1.tsv

      - name: Upload complete measurements
        uses: actions/upload-artifact@v4
        with:
          name: homer-dna1-parallel-results
          path: final
          retention-days: 1
          compression-level: 6
