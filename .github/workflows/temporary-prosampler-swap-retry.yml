name: Temporary STREME Sequential Performance Measurement

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-prosampler-swap-retry.yml'

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install STREME 5.5.9
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: streme-benchmark
          create-args: >-
            -c conda-forge
            -c bioconda
            meme=5.5.9
          cache-environment: true
          init-shell: bash

      - name: Download exact synthetic DNA datasets
        uses: actions/download-artifact@v4
        with:
          name: prosampler-benchmark-package
          path: benchmark/package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SeMinLim/morbius_plus
          run-id: 31936768291

      - name: Configure swap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p benchmark/result
          {
            echo '=== before swap ==='
            free -h
            df -h /
            swapon --show || true
          } > benchmark/result/swap_setup.txt

          FREE_BYTES="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
          RESERVE_BYTES=$((12 * 1024 * 1024 * 1024))
          MAX_SWAP_BYTES=$((48 * 1024 * 1024 * 1024))
          FILE_SWAP_BYTES=$((FREE_BYTES - RESERVE_BYTES))

          if [ "$FILE_SWAP_BYTES" -gt "$MAX_SWAP_BYTES" ]; then
            FILE_SWAP_BYTES="$MAX_SWAP_BYTES"
          fi

          if [ "$FILE_SWAP_BYTES" -ge $((8 * 1024 * 1024 * 1024)) ]; then
            sudo fallocate -l "$FILE_SWAP_BYTES" /swapfile-streme
            sudo chmod 600 /swapfile-streme
            sudo mkswap /swapfile-streme
            sudo swapon -p 10 /swapfile-streme
            sudo sysctl -w vm.swappiness=100 || true
            sudo sysctl -w vm.page-cluster=0 || true
          fi

          {
            echo
            echo '=== after swap ==='
            free -h
            df -h /
            swapon --show || true
          } >> benchmark/result/swap_setup.txt

      - name: Run all single-core STREME measurements sequentially
        shell: micromamba-shell {0}
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -u

          mkdir -p benchmark/result/logs benchmark/result/times
          mkdir -p benchmark/output benchmark/forward_input

          STREME_BIN="$(command -v streme)"
          STREME_VERSION="$($STREME_BIN --version 2>&1 | head -n 1)"
          CPU_ALLOWED="$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)"
          CPU_ID="$(printf '%s' "$CPU_ALLOWED" | cut -d',' -f1 | cut -d'-' -f1)"
          CPU_MODEL="$(lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print $2; exit}')"

          {
            echo '=== uname ==='
            uname -a
            echo
            echo '=== lscpu ==='
            lscpu
            echo
            echo '=== memory ==='
            free -h
            echo
            echo "Benchmark CPU ID      : $CPU_ID"
            echo "Benchmark CPU allowed : $CPU_ALLOWED"
            echo "STREME binary         : $STREME_BIN"
            echo "STREME version        : $STREME_VERSION"
            echo 'Strand mode           : forward only (T-to-U alphabet conversion; STREME --rna)'
            echo 'Command parameters    : --rna --w <length> --nmotifs 1 --order 2 --seed 0'
          } > benchmark/result/environment.txt

          printf 'dataset\tmotif_length\tstatus\telapsed_seconds\tuser_seconds\tsystem_seconds\tmax_rss_kb\texit_code\tcpu_model\tstreme_version\n' \
            > benchmark/result/streme_forward_elapsed_time.tsv

          for DATASET_ID in 1 2 3; do
            DNA_INPUT_FILE="benchmark/package/DATASET_DNA_${DATASET_ID}.fa"
            INPUT_FILE="benchmark/forward_input/DATASET_DNA_${DATASET_ID}_forward.fa"

            tr 'Tt' 'Uu' < "$DNA_INPUT_FILE" > "$INPUT_FILE"
            sha256sum "$DNA_INPUT_FILE" >> benchmark/result/input_checksums.sha256

            for MOTIF_LENGTH in 4 8 16; do
              OUTPUT_DIR="benchmark/output/DNA${DATASET_ID}_W${MOTIF_LENGTH}"
              LOG_FILE="benchmark/result/logs/DNA${DATASET_ID}_W${MOTIF_LENGTH}.log"
              TIME_FILE="benchmark/result/times/DNA${DATASET_ID}_W${MOTIF_LENGTH}.tsv"

              printf 'Starting DATASET_DNA_%s.fa, motif length %s\n' \
                "$DATASET_ID" "$MOTIF_LENGTH"

              sync
              sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true

              set +e
              /usr/bin/time \
                -f '%e\t%U\t%S\t%M\t%x' \
                -o "$TIME_FILE" \
                timeout --signal=TERM --kill-after=60s 14400 \
                taskset -c "$CPU_ID" \
                "$STREME_BIN" \
                  --p "$INPUT_FILE" \
                  --rna \
                  --w "$MOTIF_LENGTH" \
                  --nmotifs 1 \
                  --order 2 \
                  --seed 0 \
                  --oc "$OUTPUT_DIR" \
                > "$LOG_FILE" 2>&1
              COMMAND_RC=$?
              set -e

              ELAPSED='NA'
              USER_TIME='NA'
              SYSTEM_TIME='NA'
              MAX_RSS='NA'
              if [ -s "$TIME_FILE" ]; then
                IFS=$'\t' read -r ELAPSED USER_TIME SYSTEM_TIME MAX_RSS TIME_EXIT < "$TIME_FILE"
              fi

              STATUS='COMPLETED'
              if [ "$COMMAND_RC" -eq 124 ]; then
                STATUS='TIMEOUT_4H'
              elif [ "$COMMAND_RC" -eq 137 ] || [ "$COMMAND_RC" -eq 143 ]; then
                STATUS='KILLED_OR_OOM'
              elif [ "$COMMAND_RC" -ne 0 ]; then
                STATUS="FAILED_RC_${COMMAND_RC}"
              elif [ ! -s "$OUTPUT_DIR/streme.txt" ]; then
                STATUS='FAILED_NO_RESULT'
              fi

              printf 'DATASET_DNA_%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$DATASET_ID" \
                "$MOTIF_LENGTH" \
                "$STATUS" \
                "$ELAPSED" \
                "$USER_TIME" \
                "$SYSTEM_TIME" \
                "$MAX_RSS" \
                "$COMMAND_RC" \
                "$CPU_MODEL" \
                "$STREME_VERSION" \
                >> benchmark/result/streme_forward_elapsed_time.tsv

              tail -n 1 benchmark/result/streme_forward_elapsed_time.tsv
            done
          done

          {
            echo
            echo '=== after all measurements ==='
            free -h
            df -h /
            swapon --show || true
          } >> benchmark/result/swap_setup.txt

          cat benchmark/result/streme_forward_elapsed_time.tsv

      - name: Upload complete STREME results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streme-sequential-performance-results
          path: benchmark/result
          retention-days: 1
          compression-level: 6
