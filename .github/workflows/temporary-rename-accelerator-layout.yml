name: Temporary Rename Morbius Plus Accelerator Layout

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-rename-accelerator-layout.yml'

permissions:
  contents: write

jobs:
  rename-layout:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rename accelerator directories and update paths
        shell: bash
        run: |
          set -euo pipefail

          test -d morbius_plus_accel/hw
          test -d morbius_plus_accel/sw
          test ! -e morbius_plus_accel/kernel_morbius_plus
          test ! -e morbius_plus_accel/host_morbius_plus

          git mv morbius_plus_accel/hw morbius_plus_accel/kernel_morbius_plus
          git mv morbius_plus_accel/sw morbius_plus_accel/host_morbius_plus

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise RuntimeError(f"Missing expected text in {path}: {old!r}")
                  text = text.replace(old, new)
              p.write_text(text)

          replace(
              "morbius_plus_accel/Makefile",
              [
                  ("-C hw", "-C kernel_morbius_plus"),
                  ("-C sw", "-C host_morbius_plus"),
              ],
          )

          replace(
              "morbius_plus_accel/kernel_morbius_plus/makefile_us_alveo.mk",
              [("HOSTDIR := ../sw", "HOSTDIR := ../host_morbius_plus")],
          )

          replace(
              "README.md",
              [
                  ("│   ├── hw/                       Bluespec kernel and blueVitis/U50 build flow\n│   └── sw/                       host orchestrator, XRT backend, and kernel model",
                   "│   ├── kernel_morbius_plus/      Bluespec kernel and blueVitis/U50 build flow\n│   └── host_morbius_plus/        host orchestrator, XRT backend, and kernel model"),
                  ("cd hw\nmake all TARGET=hw_emu", "cd kernel_morbius_plus\nmake all TARGET=hw_emu"),
              ],
          )

          replace(
              "morbius_plus_accel/README.md",
              [
                  ("the same `hw/` and `sw/` organization used by blueVitis",
                   "the same `kernel_morbius_plus/` and `host_morbius_plus/` naming used by blueVitis"),
                  ("- `hw/`: Bluespec Gibbs pipelines, blueVitis AXI/XRT wrapper, U50 configuration, packaging scripts, and standalone simulation.\n- `sw/`: Markov-adjusted Seed Initializer, Morbius Orchestrator, XRT backend, bit-accurate kernel model, result writers, and tests.",
                   "- `kernel_morbius_plus/`: Bluespec Gibbs pipelines, blueVitis AXI/XRT wrapper, U50 configuration, packaging scripts, and standalone simulation.\n- `host_morbius_plus/`: Markov-adjusted Seed Initializer, Morbius Orchestrator, XRT backend, bit-accurate kernel model, result writers, and tests."),
                  ("cd hw\nmake sim\n\ncd ../sw", "cd kernel_morbius_plus\nmake sim\n\ncd ../host_morbius_plus"),
                  ("cd hw\nmake all TARGET=hw_emu", "cd kernel_morbius_plus\nmake all TARGET=hw_emu"),
              ],
          )
          PY

          rm .github/workflows/temporary-rename-accelerator-layout.yml

          git config user.name 'OpenAI Assistant'
          git config user.email 'assistant@openai.com'
          git add -A
          git commit -m 'Synchronize Morbius Plus accelerator directory names'
          git push origin main
