name: Sync optimized Morbius Plus accelerator from blueVitis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-optimized-accelerator-from-bluevitis.yml'

permissions:
  contents: write

concurrency:
  group: sync-optimized-morbius-accelerator
  cancel-in-progress: false

jobs:
  sync-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Wait for validated blueVitis source
        shell: bash
        run: |
          set -euo pipefail
          URL=https://raw.githubusercontent.com/SeMinLim/bluevitis/main/hw/kernel_morbius_plus/GibbsLane.bsv
          for attempt in $(seq 1 120); do
            if curl -L --fail --silent --show-error "$URL" -o /tmp/GibbsLane.bsv && \
               grep -Fq 'package GibbsLane;' /tmp/GibbsLane.bsv; then
              exit 0
            fi
            echo "Waiting for optimized blueVitis source: attempt ${attempt}/120"
            sleep 15
          done
          echo 'Timed out waiting for optimized blueVitis source.'
          exit 1

      - name: Synchronize optimized hardware and host files
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/SeMinLim/bluevitis/main
          SRC_HW=hw/kernel_morbius_plus
          DST_HW=morbius_plus_accel/kernel_morbius_plus
          SRC_SW=sw/host_morbius_plus
          DST_SW=morbius_plus_accel/host_morbius_plus

          hw_files=(
            Axi4MemoryMaster.bsv
            GibbsLane.bsv
            GibbsPipeline.bsv
            KernelMain.bsv
            KernelTop.bsv
            Makefile
            MorbiusTypes.bsv
            PwlArray.bsv
            README.md
            RandomGenerator.bsv
            SequenceMemory.bsv
            TestGibbsPipeline.bsv
            makefile_us_alveo.mk
            scripts/verilogcopy.sh
          )
          sw_files=(
            AcceleratorModel.cpp
            AcceleratorProtocol.cpp
            HostOrchestrator.cpp
            MorbiusPlus.h
            main.cpp
            test/test_protocol.cpp
          )

          for path in "${hw_files[@]}"; do
            mkdir -p "$DST_HW/$(dirname "$path")"
            curl -L --fail --silent --show-error \
              "$BASE/$SRC_HW/$path" -o "$DST_HW/$path"
          done
          for path in "${sw_files[@]}"; do
            mkdir -p "$DST_SW/$(dirname "$path")"
            curl -L --fail --silent --show-error \
              "$BASE/$SRC_SW/$path" -o "$DST_SW/$path"
          done
          chmod +x "$DST_HW/scripts/verilogcopy.sh"
          rm -f "$DST_HW/PwlLane.bsv"

      - name: Install Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-ubuntu-24.04.tar.gz \
            -o /tmp/bsc.tar.gz
          mkdir -p /tmp/bsc
          tar -xzf /tmp/bsc.tar.gz -C /tmp/bsc
          BSC_BIN=$(find /tmp/bsc -type f -path '*/bin/bsc' | head -n 1)
          test -n "$BSC_BIN"
          BSC_HOME=$(dirname "$(dirname "$BSC_BIN")")
          VERILOG_DIR=$(find "$BSC_HOME" -type d -path '*/Verilog' | head -n 1)
          test -n "$VERILOG_DIR"
          echo "$(dirname "$BSC_BIN")" >> "$GITHUB_PATH"
          echo "BLUESPECDIR=$(dirname "$VERILOG_DIR")" >> "$GITHUB_ENV"
          "$BSC_BIN" -version

      - name: Validate host model and protocol
        shell: bash
        run: |
          set -euo pipefail
          make -C morbius_plus_accel/host_morbius_plus clean
          make -C morbius_plus_accel/host_morbius_plus model
          make -C morbius_plus_accel/host_morbius_plus test
          rm -rf /tmp/morbius_model_output
          morbius_plus_accel/host_morbius_plus/obj/model \
            --input morbius_plus_accel/host_morbius_plus/test/DNA_TEST.fasta \
            --output /tmp/morbius_model_output/result \
            --alphabet dna \
            --motif-length 16 \
            --max-updates 16 \
            --score-threshold 1.0 \
            --seed 1 \
            --batch-size 4

      - name: Elaborate universal and DNA-specialized RTL
        shell: bash
        run: |
          set -euo pipefail
          KERNEL=morbius_plus_accel/kernel_morbius_plus
          for mode in universal dna; do
            OBJ=/tmp/morbius_bsc_${mode}
            mkdir -p "$OBJ/verilog"
            extra=()
            if [ "$mode" = dna ]; then
              extra=(-D MORBIUS_DNA_ONLY)
            fi
            (
              cd "$KERNEL"
              bsc +RTS -K512M -RTS \
                -show-schedule -aggressive-conditions -steps 10000000 \
                "${extra[@]}" \
                -bdir "$OBJ" -vdir "$OBJ/verilog" -simdir "$OBJ" \
                -info-dir "$OBJ" -fdir "$OBJ" \
                -remove-dollar -verilog -u -g kernel KernelTop.bsv
            )
          done
          grep -R -q 'BRAM2' /tmp/morbius_bsc_universal/verilog
          if grep -R -q 'RegFile #' /tmp/morbius_bsc_universal/verilog; then
            echo 'Distributed RegFile storage remains in optimized RTL.'
            exit 1
          fi

      - name: Run Bluesim regression
        shell: bash
        run: |
          set -euo pipefail
          KERNEL=morbius_plus_accel/kernel_morbius_plus
          OBJ=/tmp/morbius_bluesim
          mkdir -p "$OBJ"
          cd "$KERNEL"
          bsc +RTS -K512M -RTS \
            -show-schedule -aggressive-conditions -steps 10000000 \
            -bdir "$OBJ" -simdir "$OBJ" -info-dir "$OBJ" \
            -u -sim -g mkTestGibbsPipeline TestGibbsPipeline.bsv
          bsc +RTS -K512M -RTS \
            -bdir "$OBJ" -simdir "$OBJ" -info-dir "$OBJ" \
            -sim -e mkTestGibbsPipeline -o "$OBJ/test_gibbs"
          "$OBJ/test_gibbs"

      - name: Commit optimized accelerator directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-optimized-accelerator-from-bluevitis.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          make -C morbius_plus_accel/host_morbius_plus clean
          git config user.name 'SeMinLim'
          git config user.email 'seminl1@kookmin.ac.kr'
          git add -A
          git commit -m 'Optimize Morbius+ U50 resource architecture'
          git push origin HEAD:main
