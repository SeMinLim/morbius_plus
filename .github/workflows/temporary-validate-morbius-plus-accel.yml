name: Temporary Validate Morbius Plus Accelerator

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-validate-morbius-plus-accel.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and test host-side accelerator model
        shell: bash
        run: |
          set -euo pipefail
          make -C morbius_plus_accel/sw test

      - name: Install official Bluespec compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/bsc.tar.gz \
            https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz
          echo '9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3  /tmp/bsc.tar.gz' | sha256sum -c -
          mkdir -p /tmp/bsc
          tar xzf /tmp/bsc.tar.gz -C /tmp/bsc --strip-components=1
          echo '/tmp/bsc/bin' >> "$GITHUB_PATH"
          echo 'BLUESPECDIR=/tmp/bsc/lib' >> "$GITHUB_ENV"

      - name: Build and run standalone Gibbs-pipeline simulation
        shell: bash
        run: |
          set -euo pipefail
          make -C morbius_plus_accel/hw sim

      - name: Generate full blueVitis KernelTop Verilog
        shell: bash
        run: |
          set -euo pipefail
          cd morbius_plus_accel/hw
          rm -rf obj/top
          mkdir -p obj/top/verilog
          bsc -show-schedule -aggressive-conditions \
            -bdir obj/top \
            -vdir obj/top/verilog \
            -simdir obj/top \
            -info-dir obj/top \
            -fdir obj/top \
            -remove-dollar \
            -verilog -u -g kernel KernelTop.bsv
          test -s obj/top/verilog/kernel.v
          if grep -R '\$finish' obj/top/verilog; then
            echo 'Synthesizable kernel contains an unexpected $finish.' >&2
            exit 1
          fi

      - name: Remove temporary validation workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf morbius_plus_accel/hw/obj morbius_plus_accel/sw/obj morbius_plus_accel/sw/test/output morbius_plus_accel/sw/test/output_dataset
          rm -f .github/workflows/temporary-validate-morbius-plus-accel.yml
          git config user.name 'OpenAI Assistant'
          git config user.email 'assistant@openai.com'
          git add -A
          git commit -m 'Complete Morbius Plus accelerator validation'
          git push origin main
