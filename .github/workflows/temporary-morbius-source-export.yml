name: Temporary Morbius Source Export

on:
  push:
    paths:
      - .github/workflows/temporary-morbius-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: morbius-plus-source-export
          path: morbius_plus_accel
          if-no-files-found: error
